// Helper to lookup Lab object by id
const labById = Object.fromEntries(LABS_DATA.map(l => [l.id, l]));

// Helper to build verified lab items HTML
function renderLabCard(labRef, promptText, extraBadge) {
  const rec = labById[labRef];
  const isDone = rec && rec.done;
  const isBonus = rec && rec.classDone === 10;
  const statusPill = isDone
    ? (isBonus
        ? `<span class="px-2 py-0.5 rounded-full text-xs font-semibold badge-soft-success shrink-0">🏆 Jerry 攻克 (${rec.classDone}/11)</span>`
        : `<span class="px-2 py-0.5 rounded-full text-xs font-semibold badge-soft-success shrink-0">✅ Jerry 完成・${rec.day}</span>`)
    : `<span class="px-2 py-0.5 rounded-full text-xs font-medium badge-soft-muted shrink-0">${extraBadge || '📌 課後延伸 (0/11)'}</span>`;

  const evidenceHtml = (rec && rec.done && rec.highlight)
    ? `<div class="mt-2 px-2.5 py-1.5 rounded-lg surface-tint-success border border-[var(--border)] text-xs text-[var(--foreground)]"><span class="font-semibold text-[var(--success)]">實證亮點：</span>${rec.note}</div>`
    : '';

  const linkHtml = (rec && rec.url)
    ? `<a href="${rec.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-xs font-medium text-[var(--link)] hover:underline mt-1.5">檢視 Jerry 實作截圖 ↗</a>`
    : '';

  return `
    <div class="p-3 rounded-xl bg-[var(--content)] border border-[var(--border)]">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
        <span class="text-xs font-bold text-[var(--primary)]">${labRef}${rec ? '｜' + rec.title : ''}</span>
        ${statusPill}
      </div>
      <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">${promptText}</p>
      ${evidenceHtml}
      ${linkHtml}
    </div>
  `;
}

// ============================================================
// INTERACTIVE STATE & NAVIGATION
// ============================================================
let currentSlide = 0;
let currentLabFilter = 'all';

function initDeck() {
  const sel = document.getElementById('slideJump');
  sel.innerHTML = SLIDES.map((s, idx) => `<option value="${idx}">${s.navTitle}</option>`).join('');
  sel.addEventListener('change', (e) => goToSlide(Number(e.target.value)));

  document.getElementById('slideTotal').textContent = String(SLIDES.length).padStart(2, '0');
  document.getElementById('btnPrev').addEventListener('click', () => goToSlide(currentSlide - 1));
  document.getElementById('btnNext').addEventListener('click', () => goToSlide(currentSlide + 1));
  document.getElementById('btnGrid').addEventListener('click', toggleGrid);
  document.getElementById('btnCloseGrid').addEventListener('click', closeGrid);
  document.getElementById('btnPrint').addEventListener('click', prepareAndPrint);

  // Build Grid Cards
  document.getElementById('gridCards').innerHTML = SLIDES.map((s, idx) => `
    <button type="button" onclick="goToSlide(${idx}); closeGrid();" class="grid-thumb text-left deck-card p-4 hover:border-[var(--primary)] transition-colors space-y-1.5" data-idx="${idx}">
      <div class="flex items-center justify-between">
        <span class="text-xs font-mono font-bold text-[var(--primary)]">${String(idx + 1).padStart(2, '0')}</span>
        <span class="text-xs text-[var(--muted-foreground)] truncate max-w-[160px]">${s.tag}</span>
      </div>
      <div class="text-xs font-bold leading-snug">${s.navTitle.replace(/^\d+｜/, '')}</div>
    </button>
  `).join('');

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goToSlide(currentSlide + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goToSlide(currentSlide - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
    else if (e.key === 'End') { e.preventDefault(); goToSlide(SLIDES.length - 1); }
    else if (e.key.toLowerCase() === 'g') { e.preventDefault(); toggleGrid(); }
    else if (e.key === 'Escape') { closeGrid(); }
  });

  // Basic touch swipe for mobile
  let touchX = null;
  document.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 60) {
      if (dx < 0) goToSlide(currentSlide + 1);
      else goToSlide(currentSlide - 1);
    }
    touchX = null;
  }, { passive: true });

  goToSlide(0);
}

function goToSlide(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  currentSlide = idx;
  const stage = document.getElementById('slideStage');
  stage.classList.remove('slide-fade');
  void stage.offsetWidth;
  stage.innerHTML = SLIDES[idx].render();
  stage.classList.add('slide-fade');

  document.getElementById('slideNum').textContent = String(idx + 1).padStart(2, '0');
  document.getElementById('slideJump').value = String(idx);
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === SLIDES.length - 1;
  document.getElementById('topProgress').style.width = `${((idx + 1) / SLIDES.length) * 100}%`;

  // Highlight active grid card
  document.querySelectorAll('.grid-thumb').forEach(el => {
    const active = Number(el.dataset.idx) === idx;
    el.style.borderColor = active ? 'var(--primary)' : '';
  });

  if (SLIDES[idx].id === 'portfolio') {
    setLabFilter(currentLabFilter);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleGrid() {
  document.getElementById('gridModal').classList.toggle('hidden');
}
function closeGrid() {
  document.getElementById('gridModal').classList.add('hidden');
}

function setLabFilter(key) {
  currentLabFilter = key;
  document.querySelectorAll('.lab-filter-btn').forEach(btn => {
    const active = btn.dataset.filter === key;
    if (active) {
      btn.classList.add('bg-[var(--primary)]', 'text-[var(--primary-foreground)]', 'border-[var(--primary)]');
      btn.classList.remove('bg-[var(--content)]');
    } else {
      btn.classList.remove('bg-[var(--primary)]', 'text-[var(--primary-foreground)]', 'border-[var(--primary)]');
      btn.classList.add('bg-[var(--content)]');
    }
  });
  renderLabTable();
}

function renderLabTable() {
  const tbody = document.getElementById('labTableBody');
  if (!tbody) return;
  const q = (document.getElementById('labSearch')?.value || '').trim().toLowerCase();

  const rows = LABS_DATA.filter(item => {
    if (currentLabFilter === 'done' && !item.done) return false;
    if (currentLabFilter === 'todo' && item.done) return false;
    if (currentLabFilter === 'highlight' && !item.highlight) return false;
    if (currentLabFilter.startsWith('Day ') && item.day !== currentLabFilter) return false;
    if (q) {
      const hay = `${item.id} ${item.ch} ${item.day} ${item.title} ${item.note}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-[var(--muted-foreground)]">查無符合條件的 Lab 項目</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr class="hover:bg-[var(--content)]/60 transition-colors">
      <td class="py-2.5 px-3 font-mono font-bold whitespace-nowrap ${r.done ? 'text-[var(--primary)]' : 'text-[var(--muted-foreground)]'}">${r.id}</td>
      <td class="py-2.5 px-3 whitespace-nowrap"><span class="px-2 py-0.5 rounded-md badge-soft-muted">${r.ch}</span></td>
      <td class="py-2.5 px-3 whitespace-nowrap text-[var(--muted-foreground)]">${r.day}${r.date !== '-' ? '<br/><span class="font-mono">' + r.date.slice(5) + '</span>' : ''}</td>
      <td class="py-2.5 px-3">
        <div class="font-semibold text-[var(--foreground)]">${r.title}</div>
        <div class="text-[var(--muted-foreground)] mt-0.5">${r.note}</div>
      </td>
      <td class="py-2.5 px-3 text-center whitespace-nowrap font-mono">
        <span class="${r.classDone === 10 ? 'text-[var(--warning)] font-bold' : 'text-[var(--muted-foreground)]'}">${r.classDone}/11</span>
      </td>
      <td class="py-2.5 px-3 text-right whitespace-nowrap">
        ${r.done
          ? `<div class="flex flex-col items-end gap-1">
               <span class="px-2 py-0.5 rounded-full font-semibold badge-soft-success">${r.classDone === 10 ? '🏆 攻克' : '✅ 完成'}</span>
               <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="text-[var(--link)] hover:underline">查看截圖 ↗</a>
             </div>`
          : `<span class="px-2 py-0.5 rounded-full badge-soft-muted">${r.day}</span>`
        }
      </td>
    </tr>
  `).join('');
}

function prepareAndPrint() {
  const c = document.getElementById('printAllContainer');
  c.innerHTML = SLIDES.map((s, idx) => `
    <div class="print-slide">
      <div class="text-xs font-mono text-[var(--muted-foreground)] mb-2">SLIDE ${String(idx + 1).padStart(2, '0')} / ${SLIDES.length} — ${s.navTitle}</div>
      ${s.render()}
    </div>
  `).join('');
  // Fill lab table inside print view if present
  const printTbody = c.querySelector('#labTableBody');
  if (printTbody) {
    printTbody.innerHTML = LABS_DATA.map(r => `
      <tr class="border-b border-[var(--border)]">
        <td class="py-1.5 px-2 font-mono font-bold">${r.id}</td>
        <td class="py-1.5 px-2">${r.ch}</td>
        <td class="py-1.5 px-2">${r.day}</td>
        <td class="py-1.5 px-2"><strong>${r.title}</strong> — ${r.note}</td>
        <td class="py-1.5 px-2 text-center">${r.classDone}/11</td>
        <td class="py-1.5 px-2 text-right">${r.done ? '✅ 完成' : r.day}</td>
      </tr>
    `).join('');
  }
  window.print();
}


// Standalone Light/Dark Theme Sync (shared with index.html)
const THEME_KEY = 'az400_devops_portal_theme_v1';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('btnTheme');
  if (btn) btn.textContent = theme === 'dark' ? '淺色' : '深色';
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (saved === 'dark' || saved === 'light') {
    applyTheme(saved);
  } else {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }
  const btn = document.getElementById('btnTheme');
  if (btn) {
    btn.addEventListener('click', () => {
      const curr = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(curr === 'dark' ? 'light' : 'dark');
    });
  }
})();

initDeck();
</script>
