      -webkit-overflow-scrolling: touch;

    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);

    body[data-font="md"] {
      --fs-xs: 12.5px;
      --fs-sm: 14px;
      --fs-body: 15.5px;
      --fs-lead: 17px;

    .t-lead { font-size: var(--fs-lead); line-height: 1.65; }
    .t-h3   { font-size: var(--fs-h3);   line-height: 1.4; letter-spacing: -0.01em; }
    .t-h2   { font-size: var(--fs-h2);   line-height: 1.35; letter-spacing: -0.015em; }
    .t-h1   { font-size: var(--fs-h1);   line-height: 1.25; letter-spacing: -0.02em; }

    .code-pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--fs-code);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;

    .tint-primary { background-color: color-mix(in srgb, var(--primary) 10%, transparent); }
    .tint-success { background-color: color-mix(in srgb, var(--success) 11%, transparent); }

    .lesson-card {
      transition: border-color 160ms ease, background-color 160ms ease;

    .lesson-card:hover {
      border-color: color-mix(in srgb, var(--primary) 45%, var(--border));

</head>

  <script>
    // =========================================================================
    // 1. DEVOPS LIFECYCLE STAGES & LEARNING PHASES

      { id: 'plan',    en: 'Plan',    zh: '規劃', color: '--chart-1' },
      { id: 'code',    en: 'Code',    zh: '開發', color: '--chart-2' },
      { id: 'build',   en: 'Build',   zh: '建置', color: '--chart-3' },

      { id: 'deploy',  en: 'Deploy',  zh: '部署', color: '--chart-6' },
      { id: 'operate', en: 'Operate', zh: '維運', color: '--primary' },
      { id: 'monitor', en: 'Monitor', zh: '監控', color: '--success' }

    const stageMap = Object.fromEntries(DEVOPS_STAGES.map(s => [s.id, s]));

    const PHASES = [
      { id: 'p1', label: '第一階段｜基礎環境與版控協作', chapters: ['ch00', 'ch01', 'ch02'] },

        knowledgePoints: [

      { id: 'q04', chapterId: 'ch02', q: '新建 .NET Web 專案並執行 git init 後，為防止 bin/、obj/ 與敏感檔進入版本庫，在執行 git add . 前最關鍵的第一步為何？', options: ['先執行 git push -u origin --all', '建立符合 .NET / Visual Studio 規範的 .gitignore 檔案', '建立 App Service Plan', '轉換為 NuGet 套件'], answer: 1, explain: '必須在首次 Commit 前配置 .gitignore，避免編譯產物進入 Git 追蹤歷史造成衝突與膨脹。' },
      { id: 'q05', chapterId: 'ch03', q: '為確保發起 Pull Request 時自動跑 PR-CI 驗證且不直接觸發 Prod 主線部署，正確的雙管線設定為何？', options: ['兩條管線同時開啟 CI Trigger 並手動取消', '關閉 PR-CI 的 CI Trigger，並於 main 分支的 Branch Policy 設定 Build Validation 綁定 PR-CI', '將 PR-CI 改為 Classic Release 並移除 main 分支', '僅依賴本機手動執行 dotnet build'], answer: 1, explain: 'PR-CI 關閉 CI Trigger 改由 Branch Policy 觸發；通過驗證並合併至 main 後，才由主線 CI 產出正式成品。' },
      { id: 'q06', chapterId: 'ch03', q: '在 PR-CI 整合 GPT PR Reviewer 自動對 PR 發表行內 Review 留言時，最常遺漏的兩項關鍵權限為何？', options: ['Key Vault Access Policy 與 IIS Port 80', 'Repo 的 Build Service PR 留言權限，以及 Agent Job 勾選 Allow scripts to access the OAuth token', 'Azure Artifacts 讀取權限與 Codespaces 權限', 'MSA 雙因素驗證與 Go Deploy Extend 權限'], answer: 1, explain: 'AI 審查腳本需用 System.AccessToken 呼叫 ADO REST API 留言，故兩項權限缺一不可。' },
      { id: 'q07', chapterId: 'ch03', q: '在 CI 管線中同時導入 SonarCloud (Lab 7) 與 WhiteSource Bolt / Mend (Lab 8) 的核心互補價值為何？', options: ['SonarCloud 負責壓縮 zip，Mend 負責部署 Web App', 'SonarCloud (SAST) 分析自研原始碼品質與漏洞；Mend (SCA) 掃描第三方開源套件的 CVE 弱點與授權合規', '兩者功能重複只需擇一', 'SonarCloud 管理 Backlog，Mend 管理 Agent Pool'], answer: 1, explain: 'SAST 保護自研程式碼，SCA 保護第三方開源相依供應鏈，兩者互補缺一不可。' },
      { id: 'q08', chapterId: 'ch03', q: '希望在開發者本機執行 git commit 前，就自動攔截包含 password、sql 或 todo 關鍵字的新增程式碼並中止提交，應採用何種機制？', options: ['於專案 .git/hooks/pre-commit 比對 git diff-index 新增行，命中即 exit 1', '在 Azure Portal 開啟 Staging Slot', '設定 Pre-Deployment Approval', '修改 .csproj 的 Version 屬性'], answer: 0, explain: 'pre-commit Hook 在提交進入本機歷史前觸發，回傳非零狀態碼 (exit 1) 即阻止提交。' },
      { id: 'q09', chapterId: 'ch05', q: '在無 Organization 層級管理權限的受限環境部署 Ubuntu Self-Hosted Agent 時，關於 Agent Pool 的正確做法為何？', options: ['直接使用 Org Level Default Pool 並關閉 PAT', '自行建立 Project Level Self-Hosted Agent Pool，並於 config.sh 註冊時明確指定該 Pool Name', '改用 Classic Release 跳過 Agent 需求', '先安裝 IIS Web-Server 才能註冊 Linux Agent'], answer: 1, explain: '受限環境無法存取 Org Default Pool，必須建立 Project-Level Agent Pool 並以 PAT 指定註冊。' },
      { id: 'q10', chapterId: 'ch06', q: '如何在 Azure Pipelines 安全讀取 Azure Key Vault 機密，避免密碼硬編碼且防止日誌明碼印出？', options: ['寫入 appsettings.json 並提交至私有 Repo', '在 Pipelines Library 建立 Variable Group 並連結 Key Vault，引用 $(secretName) 由系統自動以 *** 遮罩日誌', '透過 git config --global 儲存密碼', '在 Bicep output 直接印出密碼'], answer: 1, explain: 'Linked Variable Group 於執行期動態拉取 Key Vault Secret 並自動遮罩 Console Log。' },
      { id: 'q11', chapterId: 'ch06', q: '開發 .NET Web App 呼叫 Azure OpenAI / MS Foundry 時，希望「完全不使用靜態 API Key」且本機與雲端維持同一套程式碼，最佳架構為何？', options: ['將 API Key 加密後寫死在程式中', '採用 DefaultAzureCredential：本機以 az login 驗證，雲端 Web App 啟用 Managed Identity 搭配最小權限 RBAC', '將金鑰上傳至公開 NuGet Gallery', '關閉 HTTPS 改用內網 HTTP'], answer: 1, explain: 'DefaultAzureCredential 會自動依執行環境切換驗證來源，徹底實現零金鑰 Passwordless 架構。' },
      { id: 'q12', chapterId: 'ch06', q: '使用 Azure App Configuration Feature Toggle 上線後，發現切換開關需等較久才反映至網頁，應於程式碼調整哪個設定？', options: ['縮短 UseFeatureFlags 的 CacheExpirationInterval（如設為 TimeSpan.FromSeconds(5)）', '重新執行完整 ARM Template 部署', '改用 windows-latest Agent', '重啟 Azure DevOps Organization'], answer: 0, explain: 'Feature Management 預設快取 30 秒，可透過 CacheExpirationInterval 調整刷新延遲。' },
      { id: 'q13', chapterId: 'ch07', q: '在 CI Pipeline 自動推送 HealthMgr*.nupkg 至 Azure Artifacts Private Feed 時遇到 403 權限拒絕，最可能遺漏的設定為何？', options: ['未設定 TargetFramework', '未在 Private Feed Permissions 將 Project Collection Build Service 加入 Contributor 權限', '未開放 Port 80 防火牆', '未建立 Staging Deployment Slot'], answer: 1, explain: 'CI 管線以 Build Service 身分執行推送，須於 Feed Permissions 授予 Contributor 寫入權限。' },
      { id: 'q14', chapterId: 'ch08', q: '相較於傳統 ARM JSON Template，為何現代 Azure IaC 實務普遍優先採用 Azure Bicep？', options: ['Bicep 可繞過 Azure 訂閱權限檢查', 'Bicep 語法更簡潔、具強型別提示與原生字串插值，底層仍編譯為 ARM 執行且功能完全對等', 'Bicep 只能部署單一環境', 'ARM JSON 已無法使用 Azure CLI 部署'], answer: 1, explain: 'Bicep 大幅消除 JSON 冗餘括號與 concat()，提升可讀性與維護效率且 100% 相容 ARM。' },
      { id: 'q15', chapterId: 'ch09', q: '在 Classic Release Pipeline 實作 Dev → QA → Prod 三階段交付時，貫徹的核心原則為何？', options: ['每個環境各自重新 git clone 與重新編譯', 'Build Once, Deploy Many：只產出一份不可變 Artifact，同一成品依序流經各環境，差異由外部組態注入', '只在 Prod 執行單元測試', '每次部署前手動刪除 Resource Group'], answer: 1, explain: '一次建置多處部署確保 QA 驗證過的二進位成品與 Prod 上線的完全一致。' },
      { id: 'q16', chapterId: 'ch09', q: '於 Release Pipeline 設定 Release Gate 檢核 Active Bugs < 5 才放行，設定上最關鍵的兩項前提為何？', options: ['查詢存於 My Queries 且須啟用藍綠 Slot', '查詢必須存為 Shared Query，且必須在 Query Security 開放 Build Service 讀取權限', '先手動刪除所有 Bug 並關閉 CI Trigger', '改用 Self-Hosted Linux Agent'], answer: 1, explain: 'Release Gate 僅能選取 Shared Query，且必須開放 Project Collection Build Service 讀取權限。' },
      { id: 'q17', chapterId: 'ch09', q: '使用 Staging Slot 實作藍綠部署時，若新版 Swap 至 Production 後突發嚴重異常，最快且最低風險的止血方式為何？', options: ['緊急改程式重跑整個 CI/CD 管線', '再次執行 Swap Slots，瞬間將留在 Staging Slot 的穩定舊版切回 Production', '刪除 App Service 重跑 ARM Template', '關閉 Release Gate'], answer: 1, explain: 'Swap 後原穩定舊版留在 Staging Slot 中，再次 Swap 即可達成秒級零停機回滾。' },
      { id: 'q18', chapterId: 'ch09', q: '在 Multi-Stage YAML Pipeline 中，如何確保 Deploy Stage 只在 Build 成功後執行並掛載人工簽核？', options: ['把 Deploy 拆回 Classic Release', '於 Deploy Stage 設定 dependsOn: Build 與 condition: succeeded()，並在 deployment job 指定 environment 連結 ADO Environments', '在 Build Stage 加入 Write-Host 暫停', '將 trigger 設為 none 並本機手動部署'], answer: 1, explain: '透過 dependsOn + condition 控制順序，以 environment 欄位無縫對接 ADO Environments 的 Approvals/Checks。' },
      { id: 'q19', chapterId: 'ch09', q: '需將傳統 IIS 網站同步部署至多台 Azure Windows VM（vm01、vm02）或地端主機群，最適合的部署機制為何？', options: ['Azure App Service Deployment Slots', '建立 Deployment Group，在各目標 VM 執行註冊腳本納管後透過 IIS Deployment Job 批次滾動部署', '改用 GitHub Codespaces 託管流量', '在 Wiki 插入 Mermaid 圖表'], answer: 1, explain: 'Deployment Group 透過輕量 Agent 納管多台 VM，支援 Tag 分群與滾動部署比例。' },
      { id: 'q20', chapterId: 'ch01', q: '將 ASP.NET 建置成品自動部署至 Azure Web App 時，Azure App Service Deploy Task 的 Package or folder 應指向哪個內建變數？', options: ['$(System.DefaultWorkingDirectory)/.git/*', '$(build.artifactstagingdirectory)/**/*.zip', 'C:\\inetpub\\wwwroot\\Default.htm', 'https://dev.azure.com/_git/drop'], answer: 1, explain: '$(build.artifactstagingdirectory) 指向建置 Agent 打包成品的暫存目錄，搭配 /**/*.zip 精準抓取部署包。' },
      { id: 'q21', chapterId: 'ch10', q: '在 .NET MSTest 專案導入 Microsoft Playwright (Lab 27-1) 時，若想透過操作網頁自動錄製測試腳本，應使用哪個 CLI 指令？', options: ['dotnet tool publish --ui-record', 'playwright codegen', 'az webapp slot swap --record', 'reportgenerator -reporttypes:Html'], answer: 1, explain: '安裝 Microsoft.Playwright.CLI 與 playwright install 後，執行 playwright codegen 即可互動錄製產生 C# UI 測試腳本。' },
      { id: 'q22', chapterId: 'ch10', q: '在 Azure Pipelines (windows-latest) 執行 PlaywrightAutoUITest (Lab 27-2) 時，dotnet build 與 dotnet test 之間必須補上哪兩道 PowerShell 步驟？', options: ['安裝 IIS Web-Server 與開啟 Port 80', '安裝 Microsoft.Playwright.CLI 全域工具，並執行 playwright install 下載執行期瀏覽器', '建立 Key Vault Secret 與 Variable Group', '執行 git init 與建立 .gitignore'], answer: 1, explain: '雲端 Build Agent 為全新環境未預載瀏覽器核心，必先安裝 CLI 並執行 playwright install 才能啟動無頭瀏覽器測試。' },
      { id: 'q23', chapterId: 'ch10', q: '於 .NET Build Pipeline 導入單元測試覆蓋率 (Lab 28) 並在 ADO Build Summary 顯示視覺化報表，正確設定組合為何？', options: ['於 dotnet build 加 --zip 並用 ArchiveFiles@2 發佈', '於 dotnet test 加 --collect:"XPlat Code Coverage"，並加入 Publish Code Coverage Results v1.0（Cobertura + $(Agent.TempDirectory)/**/coverage.cobertura.xml）', '改用 .NET 5.0.408 並關閉 CI Trigger', '啟用 Pre-Deployment Approval 並查詢 All Bugs'], answer: 1, explain: '--collect:"XPlat Code Coverage" 輸出 Cobertura XML 至暫存目錄，再由 Publish Code Coverage Results v1.0 收集呈現於建置摘要。' }
    ];

    const FLASHCARDS = [
      { id: 'fc01', chapterId: 'ch02', front: '為何 Feature Branch 要關聯「Task」，而不是直接關聯「PBI」？', back: '單一 PBI 常由多個 Task 組成。綁定 Task 可保持短命小批次 PR，且 PR 合併自動關閉 Task 時不會誤把尚未全部完工的 PBI 標為 Done。' },
      { id: 'fc02', chapterId: 'ch04', front: 'Cycle Time 與 Lead Time 有什麼核心差異？', back: 'Cycle Time = Active → Closed（純工程交付效率）；Lead Time = New → Closed（客戶總等待時間）。兩者落差大代表需求前期排隊瓶頸嚴重。' },
      { id: 'fc03', chapterId: 'ch01', front: '新版 Azure DevOps 找不到「Classic Editor」，原因與解法是什麼？', back: '新版組織預設關閉 Classic Pipeline 以推廣 YAML。若需練習，須至 Organization Settings → Pipelines → Settings 重新啟用。' },
      { id: 'fc04', chapterId: 'ch03', front: '主線 CI 與 PR-CI 的觸發與職責如何區分？', back: 'PR-CI「關閉 CI Trigger」，由 main Branch Policy (Build Validation) 觸發以驗證 PR；主線 CI「開啟 CI Trigger」，於 PR 合併至 main 後才產出正式成品。' },
      { id: 'fc05', chapterId: 'ch03', front: '整合 GPT PR Reviewer 自動留言時，必設的兩項關鍵權限為何？', back: '1) Repo Security 賦予 Build Service「Contribute to pull requests」權限；2) Pipeline Agent Job 勾選「Allow scripts to access the OAuth token」。' },
      { id: 'fc06', chapterId: 'ch03', front: 'DevSecOps 中的 SAST (SonarCloud) 與 SCA (Mend) 如何分工？', back: 'SAST 掃描「自研原始碼」找 Bugs、安全漏洞與壞味道；SCA 掃描「第三方開源套件」找已知 CVE 弱點與開源授權合規風險。' },
      { id: 'fc07', chapterId: 'ch03', front: '本機 Git pre-commit Hook 的價值與團隊實務限制？', back: '在提交進歷史前即時攔截 password|todo|sql 並 exit 1；限制是 .git/hooks 不隨 Repo 同步，團隊需搭配 Husky 或伺服器端檢查互補。' },
      { id: 'fc08', chapterId: 'ch05', front: '何時需用 Self-Hosted Agent？在受限環境建置要注意什麼？', back: '需連內網資源、客製化 SDK/快取或突破免費分鐘數時使用。無 Org 權限時不可用 Default Pool，須建 Project-Level Agent Pool 並以 PAT 指定註冊。' },
      { id: 'fc09', chapterId: 'ch06', front: 'Azure Key Vault 如何與 Azure Pipelines 安全整合？', back: '在 Pipelines Library 建立 Variable Group 並 Link 至 Key Vault 選取 Secrets。執行期動態注入 $(secretName)，日誌自動將機密遮罩為 ***。' },
      { id: 'fc10', chapterId: 'ch06', front: 'DefaultAzureCredential 如何兼顧本機開發與雲端零金鑰上線？', back: '同一份程式碼不寫 API Key：本機自動採用 az login / IDE 憑證；部署至 Azure Web App 後自動切換為 Managed Identity + 最小權限 RBAC。' },
      { id: 'fc11', chapterId: 'ch06', front: '為何要分離「部署 (Deployment)」與「發布 (Release)」？', back: '透過 App Configuration Feature Toggle 先暗發程式碼，再免重啟即時開關、灰度放量或秒級熔斷，並可用 CacheExpirationInterval 控制刷新延遲。' },
      { id: 'fc12', chapterId: 'ch07', front: '推送 NuGet 套件至 Azure Artifacts Private Feed 遇到 403 怎麼辦？', back: 'CI 管線是以 Build Service 身分推送，必須至 Feed Settings → Permissions 將 Project Collection Build Service 設為 Contributor。' },
      { id: 'fc13', chapterId: 'ch08', front: 'Azure Bicep 與 ARM JSON 的關係與核心優勢為何？', back: 'Bicep 底層編譯為 ARM JSON 執行且功能 100% 對等；優勢在於大幅簡化語法、原生字串插值、強型別提示與自動推導資源依賴。' },
      { id: 'fc14', chapterId: 'ch09', front: 'Release Gate 檢核 Active Bugs < 5 常見的兩大失敗原因？', back: '1) 查詢存在 My Queries 而非 Shared Queries；2) 忘記於該 Shared Query 的 Security 權限開放 Project Collection Build Service 讀取權限。' },
      { id: 'fc15', chapterId: 'ch09', front: 'Blue-Green 藍綠部署 (Staging Slot Swap) 如何同時達成零停機與秒級回滾？', back: '新版先部署至 Staging Slot 預熱驗收，再 Swap 瞬間切換流量至 Production（零停機）；穩定舊版留在 Staging，新版異常只需再次 Swap 即刻回滾。' },
      { id: 'fc16', chapterId: 'ch09', front: 'Multi-Stage YAML 中 deployment job 的 environment 欄位用途為何？', back: '將 YAML 部署階段直接綁定至 ADO Environments（如 production），可在 UI 集中設定人工 Approvals、自動 Checks 並留存完整部署稽核歷程。' },
      { id: 'fc17', chapterId: 'ch10', front: 'Azure Pipelines 跑 Playwright UI 測試，dotnet test 前必做的兩道 PowerShell 步驟？', back: '因為雲端 Build Agent 每次皆為乾淨環境，必須先執行 (1) dotnet tool install --global Microsoft.Playwright.CLI 與 (2) playwright install 下載執行期瀏覽器。' },
      { id: 'fc18', chapterId: 'ch10', front: '如何在 Azure Pipelines 收集並呈現 .NET 單元測試程式碼覆蓋率？', back: '於 dotnet test 加 --collect:"XPlat Code Coverage"，再加入 Publish Code Coverage Results v1.0（工具選 Cobertura、路徑設 $(Agent.TempDirectory)/**/coverage.cobertura.xml）。' }
    ];

    // =========================================================================
    // 4. PERSISTENT PROGRESS & APP STATE
    // =========================================================================
    const STORE_KEY = 'az400_teaching_site_v1';
    const FONT_KEY = 'az400_teaching_font_v1';
    const FONT_STEPS = [
      { id: 'md', label: '標準' },
      { id: 'lg', label: '大' },
      { id: 'xl', label: '特大' }
    ];

    function loadProgress() {
      const def = { doneGoals: [], doneLabs: [], quizAnswers: {}, fcStatus: {} };
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return def;
        const p = JSON.parse(raw);
        return {
          doneGoals: Array.isArray(p.doneGoals) ? p.doneGoals : [],
          doneLabs: Array.isArray(p.doneLabs) ? p.doneLabs : [],
          quizAnswers: p.quizAnswers && typeof p.quizAnswers === 'object' ? p.quizAnswers : {},
          fcStatus: p.fcStatus && typeof p.fcStatus === 'object' ? p.fcStatus : {}
        };
      } catch (e) {
        return def;
      }
    }

    const progress = loadProgress();
    function saveProgress() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
    }

    const state = {
      mode: 'chapter', // 'chapter' | 'syllabus' | 'exam'
      chapterId: 'ch00',
      labIdx: 0,
      checkMode: 'quiz', // 'quiz' | 'flashcard'
      chQuizIdx: 0,
      chFcIdx: 0,
      chFcFlipped: false,
      examMode: 'mcq', // 'mcq' | 'flashcard'
      examFilter: 'all', // 'all' | 'wrong' | chapterId
      examIdx: 0,
      examFcIdx: 0,
      examFcFlipped: false,
      fontSize: 'lg',
      drawerOpen: false,
      searchOpen: false,
      searchQuery: '',
      confirmReset: false
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applyFontSize(sizeId) {
      const valid = FONT_STEPS.find(f => f.id === sizeId) || FONT_STEPS[1];
      state.fontSize = valid.id;
      document.body.setAttribute('data-font', valid.id);
      const btn = document.getElementById('btn-font-size');
      if (btn) btn.textContent = `字級：${valid.label}`;
      try { localStorage.setItem(FONT_KEY, valid.id); } catch (e) {}
    }

    function initFontSize() {
      let saved = 'lg';
      try { saved = localStorage.getItem(FONT_KEY) || 'lg'; } catch (e) {}
      applyFontSize(saved);
    }

    function isGoalDone(id) { return progress.doneGoals.includes(id); }
    function isLabDone(id) { return progress.doneLabs.includes(id); }

    function toggleGoal(id) {
      const idx = progress.doneGoals.indexOf(id);
      if (idx >= 0) progress.doneGoals.splice(idx, 1);
      else progress.doneGoals.push(id);
      saveProgress();
    }

    function toggleLab(id) {
      const idx = progress.doneLabs.indexOf(id);
      if (idx >= 0) progress.doneLabs.splice(idx, 1);
      else progress.doneLabs.push(id);
      saveProgress();
    }

    function getChapterStats(ch) {
      const gDone = ch.goals.filter(g => isGoalDone(g.id)).length;
      const lDone = ch.labs.filter(l => isLabDone(l.id)).length;
      const total = ch.goals.length + ch.labs.length;
      const done = gDone + lDone;
      const pct = total ? Math.round((done / total) * 100) : 0;
      return { gDone, gTotal: ch.goals.length, lDone, lTotal: ch.labs.length, done, total, pct, completed: total > 0 && done === total };
    }

    function toggleWholeChapter(ch) {
      const st = getChapterStats(ch);
      const goalIds = ch.goals.map(g => g.id);
      const labIds = ch.labs.map(l => l.id);
      if (st.completed) {
        progress.doneGoals = progress.doneGoals.filter(id => !goalIds.includes(id));
        progress.doneLabs = progress.doneLabs.filter(id => !labIds.includes(id));
      } else {
        goalIds.forEach(id => { if (!progress.doneGoals.includes(id)) progress.doneGoals.push(id); });
        labIds.forEach(id => { if (!progress.doneLabs.includes(id)) progress.doneLabs.push(id); });
      }
      saveProgress();
    }

    function getOverallStats() {
      let done = 0, total = 0, completedCh = 0;
      CURRICULUM.forEach(ch => {
        const s = getChapterStats(ch);
        done += s.done;
        total += s.total;
        if (s.completed) completedCh++;
      });
      const pct = total ? Math.round((done / total) * 100) : 0;
      return { done, total, pct, completedCh, totalCh: CURRICULUM.length };
    }

    function stageBadge(stageId) {
      const s = stageMap[stageId];
      if (!s) return '';
      return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md border border-[var(--border)] bg-[var(--background)] t-xs font-medium text-[var(--foreground)]">
        <span class="w-2 h-2 rounded-full shrink-0" style="background-color: var(${s.color})"></span>
        <span>${s.en} ${s.zh}</span>
      </span>`;
    }

    function copyText(text, btn) {
      const done = () => {
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = '已複製 ✓';
        setTimeout(() => { btn.textContent = orig; }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      if (cb) cb();
    }

    // =========================================================================
    // 5. SIDEBAR OUTLINE RENDERER (DESKTOP + MOBILE DRAWER)
    // =========================================================================
    function renderOutlineHtml(isMobile) {
      const overall = getOverallStats();
      return `
        <div class="p-4 border-b border-[var(--border)] shrink-0">
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="t-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">課程學習路徑</span>
            ${isMobile ? `<button id="btn-close-drawer" class="px-2 py-0.5 rounded border border-[var(--border)] bg-[var(--card)] text-xs font-semibold cursor-pointer">關閉</button>` : `<span class="font-mono t-xs font-semibold text-[var(--foreground)]">${overall.completedCh}/${overall.totalCh} 章</span>`}
          </div>
          <div class="w-full h-2 rounded-full bg-[var(--secondary)] overflow-hidden mb-1.5">
            <div class="h-full rounded-full transition-all" style="width: ${overall.pct}%; background-color: var(--success);"></div>
          </div>
          <div class="flex items-center justify-between t-xs text-[var(--muted-foreground)]">
            <span>已完成 ${overall.done} / ${overall.total} 項目標與實作</span>
            <span class="font-mono font-semibold text-[var(--foreground)]">${overall.pct}%</span>
          </div>
        </div>

        <nav class="flex-1 min-h-0 overflow-y-auto touch-scroll p-3 space-y-4">
          ${PHASES.map(ph => `
            <div>
              <div class="px-2 mb-1.5 text-xs font-bold text-[var(--muted-foreground)] tracking-wide">${ph.label}</div>
              <div class="space-y-1">
                ${ph.chapters.map(cid => {
                  const ch = chapterMap[cid];
                  const st = getChapterStats(ch);
                  const active = state.mode === 'chapter' && state.chapterId === cid;
                  const leadStage = stageMap[ch.stages[0]];
                  return `
                    <button data-goto-chapter="${cid}" class="w-full text-left px-2.5 py-2 rounded-lg border transition-colors cursor-pointer flex items-start justify-between gap-2 ${
                      active
                        ? 'bg-[var(--card)] border-[var(--primary)] text-[var(--foreground)]'
                        : 'bg-transparent border-transparent hover:bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                    }">
                      <div class="flex items-start gap-2 min-w-0">
                        <span class="w-2 h-2 rounded-full mt-2 shrink-0" style="background-color: var(${st.completed ? '--success' : leadStage.color})"></span>
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                            <span class="font-mono text-xs font-bold ${active ? 'text-[var(--primary)]' : ''}">${ch.num}</span>
                            <span class="text-xs font-semibold truncate ${active ? 'text-[var(--foreground)]' : ''}">${ch.title.split(' (')[0]}</span>
                          </div>
                          <div class="text-xs text-[var(--muted-foreground)] truncate mt-0.5">${ch.goals.length} 目標 · ${ch.knowledgePoints.length} 知識點 · ${ch.labs.length} 實作</div>
                        </div>
                      </div>
                      <span class="font-mono text-xs shrink-0 mt-0.5 ${st.completed ? 'text-[var(--success)] font-bold' : 'text-[var(--muted-foreground)]'}">${st.completed ? '✓' : `${st.pct}%`}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </nav>

        <div class="p-3 border-t border-[var(--border)] shrink-0 flex items-center gap-2">
          <button data-mode="syllabus" class="flex-1 py-2 px-2.5 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] text-xs font-semibold text-[var(--foreground)] cursor-pointer transition-colors">全課程大綱</button>
          <button data-mode="exam" class="flex-1 py-2 px-2.5 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold hover:opacity-90 cursor-pointer transition-opacity">模擬測驗</button>
        </div>
      `;
    }

    // =========================================================================
    // 6. VIEW A: CHAPTER TEACHING EXPERIENCE (主題 -> 目標 -> 知識點 -> 實作 -> 檢核)
    // =========================================================================
    function renderChapterView() {
      const ch = chapterMap[state.chapterId];
      const idx = CURRICULUM.findIndex(c => c.id === ch.id);
      const prevCh = idx > 0 ? CURRICULUM[idx - 1] : null;
      const nextCh = idx < CURRICULUM.length - 1 ? CURRICULUM[idx + 1] : null;
      const stats = getChapterStats(ch);
      const lab = ch.labs[state.labIdx] || ch.labs[0];
      const phaseObj = PHASES.find(p => p.id === ch.phase);

      const chQuizzes = QUIZ_QUESTIONS.filter(q => q.chapterId === ch.id);
      const chCards = FLASHCARDS.filter(f => f.chapterId === ch.id);
      if (state.chQuizIdx >= chQuizzes.length) state.chQuizIdx = 0;
      if (state.chFcIdx >= chCards.length) state.chFcIdx = 0;

      // Chapter Quiz / Flashcard block
      let checkHtml = '';
      if (chQuizzes.length === 0 && chCards.length === 0) {
        checkHtml = `
          <div class="p-5 rounded-xl bg-[var(--card)] border border-[var(--border)] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="t-sm font-bold text-[var(--foreground)]">本章為課前環境初始化單元</div>
              <p class="t-sm text-[var(--muted-foreground)] mt-1">完成上方所有學習目標與環境確認後，即可直接進入 Ch 01 建立您的第一條 Azure DevOps 管線。</p>
            </div>
            <button data-goto-chapter="ch01" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] t-sm font-semibold shrink-0 cursor-pointer">前往 Ch 01 →</button>
          </div>
        `;
      } else if (state.checkMode === 'quiz' && chQuizzes.length > 0) {
        const q = chQuizzes[state.chQuizIdx];
        const picked = progress.quizAnswers[q.id];
        const answered = picked !== undefined;
        const isCorrect = answered && picked === q.answer;
        const letters = ['A', 'B', 'C', 'D'];
        checkHtml = `
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between gap-2 flex-wrap pb-3 border-b border-[var(--border)]">
              <div class="flex items-center gap-2">
                <span class="font-mono t-xs font-bold px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)]">隨堂題 ${state.chQuizIdx + 1} / ${chQuizzes.length}</span>
                <span class="t-xs text-[var(--muted-foreground)]">AZ-400 情境檢核</span>
              </div>
              ${chQuizzes.length > 1 ? `
                <div class="flex items-center gap-1.5">
                  <button data-ch-quiz-step="-1" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">← 上一題</button>
                  <button data-ch-quiz-step="1" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">下一題 →</button>
                </div>
              ` : ''}
            </div>

            <p class="t-lead font-bold text-[var(--foreground)]">${escapeHtml(q.q)}</p>

            <div class="space-y-2.5">
              ${q.options.map((opt, oi) => {
                let cls = 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)] text-[var(--foreground)]';
                let tag = letters[oi];
                if (answered) {
                  if (oi === q.answer) { cls = 'tint-success border-[var(--success)] text-[var(--foreground)] font-semibold'; tag = `${letters[oi]} ✓`; }
                  else if (oi === picked) { cls = 'tint-error border-[var(--error)] text-[var(--foreground)]'; tag = `${letters[oi]} ✗`; }
                  else { cls = 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)] opacity-65'; }
                }
                return `
                  <button data-answer-q="${q.id}|${oi}" class="w-full text-left p-3.5 rounded-xl border transition-colors flex items-start gap-3 cursor-pointer ${cls}">
                    <span class="font-mono t-xs font-bold px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] shrink-0 mt-0.5">${tag}</span>
                    <span class="t-body">${escapeHtml(opt)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            ${answered ? `
              <div class="p-4 rounded-xl border ${isCorrect ? 'tint-success border-[var(--success)]' : 'tint-error border-[var(--error)]'}">
                <div class="t-sm font-bold mb-1 ${isCorrect ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${isCorrect ? '答對了！已掌握此核心觀念' : `再複習一下 — 正確答案為 ${letters[q.answer]}`}</div>
                <p class="t-sm text-[var(--foreground)]">${escapeHtml(q.explain)}</p>
              </div>
            ` : ''}
          </div>
        `;
      } else if (chCards.length > 0) {
        const fc = chCards[state.chFcIdx];
        const fstat = progress.fcStatus[fc.id];
        checkHtml = `
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 sm:p-6 space-y-4">
            <div class="flex items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
              <div class="flex items-center gap-2">
                <span class="font-mono t-xs font-bold px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)]">記憶卡 ${state.chFcIdx + 1} / ${chCards.length}</span>
                ${fstat === 'mastered' ? '<span class="t-xs font-bold text-[var(--success)]">✓ 已掌握</span>' : fstat === 'review' ? '<span class="t-xs font-bold text-[var(--warning)]">待複習</span>' : ''}
              </div>
              ${chCards.length > 1 ? `
                <div class="flex items-center gap-1.5">
                  <button data-ch-fc-step="-1" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">← 上一張</button>
                  <button data-ch-fc-step="1" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">下一張 →</button>
                </div>
              ` : ''}
            </div>

            <div id="ch-fc-box" role="button" tabindex="0" class="min-h-[180px] p-6 rounded-xl border-2 flex flex-col items-center justify-center text-center cursor-pointer transition-colors ${
              state.chFcFlipped ? 'tint-primary border-[var(--primary)]' : 'bg-[var(--background)] border-[var(--border)] hover:border-[var(--primary)]'
            }">
              <span class="t-xs font-mono uppercase tracking-wider px-2 py-0.5 rounded mb-3 ${state.chFcFlipped ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'}">${state.chFcFlipped ? '核心解答' : '點擊翻卡思考'}</span>
              <p class="${state.chFcFlipped ? 't-body text-[var(--foreground)]' : 't-h3 font-bold text-[var(--foreground)]'} max-w-2xl">${escapeHtml(state.chFcFlipped ? fc.back : fc.front)}</p>
            </div>

            <div class="flex items-center gap-2">
              <button data-mark-fc="${fc.id}|review" class="flex-1 py-2 rounded-lg border t-sm font-semibold cursor-pointer ${fstat === 'review' ? 'tint-warning border-[var(--warning)]' : 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]'}">↺ 標記待複習</button>
              <button id="btn-flip-ch-fc" class="px-4 py-2 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)] t-sm font-semibold cursor-pointer">${state.chFcFlipped ? '看題目' : '翻看答案'}</button>
              <button data-mark-fc="${fc.id}|mastered" class="flex-1 py-2 rounded-lg border t-sm font-semibold cursor-pointer ${fstat === 'mastered' ? 'tint-success border-[var(--success)] text-[var(--success)]' : 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]'}">✓ 已掌握</button>
            </div>
          </div>
        `;
      }

      return `
        <article class="max-w-4xl mx-auto px-4 sm:px-8 py-6 sm:py-9 space-y-10">
          <!-- CHAPTER HERO HEADER -->
          <header class="pb-6 border-b border-[var(--border)] space-y-4">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-mono t-xs font-bold px-2.5 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)]">${ch.num}</span>
                <span class="t-xs font-semibold text-[var(--muted-foreground)]">${phaseObj.label}</span>
                <span class="t-xs text-[var(--muted-foreground)]">· 預估學習 ${ch.duration}</span>
              </div>
              <button data-toggle-whole-ch="${ch.id}" class="px-3 py-1.5 rounded-lg border t-xs font-semibold cursor-pointer transition-colors ${
                stats.completed
                  ? 'tint-success border-[var(--success)] text-[var(--success)]'
                  : 'bg-[var(--card)] border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)]'
              }">${stats.completed ? '✓ 本章已全部完成' : `章節進度 ${stats.done}/${stats.total} · 標記完成`}</button>
            </div>

            <div>
              <h1 class="t-h1 font-bold text-[var(--foreground)]">${ch.title}</h1>
              <p class="t-lead text-[var(--muted-foreground)] mt-2">${ch.subtitle}</p>
            </div>

            <!-- DEVOPS STAGE TAGS & IN-CHAPTER JUMP ANCHORS -->
            <div class="flex items-center justify-between gap-3 flex-wrap pt-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="t-xs font-semibold text-[var(--muted-foreground)] mr-1">DevOps 階段：</span>
                ${ch.stages.map(s => stageBadge(s)).join('')}
              </div>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                <a href="#sec-topic" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] shrink-0">01 主題</a>
                <a href="#sec-goals" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] shrink-0">02 目標</a>
                <a href="#sec-kp" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] shrink-0">03 知識點</a>
                <a href="#sec-labs" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] shrink-0">04 實作</a>
                <a href="#sec-check" class="px-2.5 py-1 rounded-md bg-[var(--card)] border border-[var(--border)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] shrink-0">05 檢核</a>
              </div>
            </div>
          </header>

          <!-- SECTION 01: 主題說明 (TOPIC & LIFECYCLE CONTEXT) -->
          <section id="sec-topic" class="space-y-4 scroll-mt-6">
            <div class="flex items-baseline gap-3">
              <span class="font-mono t-sm font-bold text-[var(--primary)]">01</span>
              <h2 class="t-h2 font-bold text-[var(--foreground)]">本章主題與實務定位</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-2">
                <div class="t-xs font-bold uppercase tracking-wider text-[var(--primary)]">這章在學什麼？</div>
                <p class="t-body text-[var(--foreground)]">${escapeHtml(ch.topicWhat)}</p>
              </div>
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-2">
                <div class="t-xs font-bold uppercase tracking-wider text-[var(--success)]">為什麼實務上很重要？</div>
                <p class="t-body text-[var(--foreground)]">${escapeHtml(ch.topicWhy)}</p>
              </div>
            </div>

            <!-- DEVOPS LIFECYCLE POSITION & UPSTREAM/DOWNSTREAM LINKS -->
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-4">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <span class="t-sm font-bold text-[var(--foreground)]">在 DevOps 八大階段中的定位</span>
                <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
                  ${DEVOPS_STAGES.map(s => {
                    const hit = ch.stages.includes(s.id);
                    return `<span class="px-2 py-0.5 rounded text-xs font-mono shrink-0 border ${
                      hit
                        ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)] font-bold'
                        : 'bg-[var(--background)] text-[var(--muted-foreground)] border-[var(--border)] opacity-60'
                    }">${s.en}</span>`;
                  }).join('')}
                </div>
              </div>
              <p class="t-sm text-[var(--muted-foreground)]">${escapeHtml(ch.stageNote)}</p>

              <div class="pt-3 border-t border-[var(--border)] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="t-xs font-semibold text-[var(--muted-foreground)]">前置先修：</span>
                  ${ch.prereq.length === 0
                    ? '<span class="t-xs text-[var(--muted-foreground)]">無（課程起點）</span>'
                    : ch.prereq.map(id => `<button data-goto-chapter="${id}" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] cursor-pointer"><strong class="font-mono text-[var(--primary)]">${chapterMap[id].num}</strong> ${chapterMap[id].title.split(' (')[0]}</button>`).join('')
                  }
                </div>
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="t-xs font-semibold text-[var(--muted-foreground)]">銜接解鎖：</span>
                  ${ch.next.map(id => `<button data-goto-chapter="${id}" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-medium text-[var(--foreground)] cursor-pointer"><strong class="font-mono text-[var(--success)]">${chapterMap[id].num}</strong> ${chapterMap[id].title.split(' (')[0]} →</button>`).join('')}
                </div>
              </div>
            </div>
          </section>

          <!-- SECTION 02: 學習目標 (CHECKABLE LEARNING OBJECTIVES) -->
          <section id="sec-goals" class="space-y-4 scroll-mt-6">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-baseline gap-3">
                <span class="font-mono t-sm font-bold text-[var(--primary)]">02</span>
                <h2 class="t-h2 font-bold text-[var(--foreground)]">學習目標</h2>
              </div>
              <span class="t-xs font-mono text-[var(--muted-foreground)]">已達成 ${stats.gDone} / ${stats.gTotal} 項（點擊勾選）</span>
            </div>

            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl divide-y divide-[var(--border)] overflow-hidden">
              ${ch.goals.map((g, gi) => {
                const done = isGoalDone(g.id);
                return `
                  <button data-toggle-goal="${g.id}" class="w-full text-left p-4 sm:px-5 sm:py-4 flex items-start gap-3.5 hover:bg-[var(--sidebar)] transition-colors cursor-pointer ${done ? 'tint-success' : ''}">

              <div class="flex items-baseline gap-3">

                  <button data-check-mode="flashcard" class="px-3 py-1 rounded-md t-xs font-semibold cursor-pointer ${state.checkMode === 'flashcard' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">重點記憶卡 (${chCards.length})</button>

            ${prevCh ? `

            ${nextCh ? `

                <div class="t-sm font-bold text-[var(--primary)] mt-1">${nextCh.num} · ${nextCh.title.split(' (')[0]}</div>
              </button>
            ` : `
              <button data-mode="exam" class="text-left sm:text-right p-4 rounded-xl border border-[var(--primary)] tint-primary hover:opacity-90 transition-opacity cursor-pointer">
                <div class="t-xs text-[var(--primary)] font-semibold">全課程 11 章已讀完 🎉</div>
                <div class="t-sm font-bold text-[var(--foreground)] mt-1">前往全課程 AZ-400 綜合模擬測驗 →</div>
              </button>
            `}
          </footer>
        </article>
      `;
    }

    // =========================================================================

    // =========================================================================
    function renderSyllabusView() {
      const overall = getOverallStats();

      const totalKps = CURRICULUM.reduce((a, c) => a + c.knowledgePoints.length, 0);
      const totalLabs = CURRICULUM.reduce((a, c) => a + c.labs.length, 0);

      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-8 py-6 sm:py-9 space-y-8">
          <header class="pb-6 border-b border-[var(--border)] space-y-4">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div>
                <div class="t-xs font-mono font-bold text-[var(--primary)] uppercase tracking-wider">AZ-400 Azure DevOps Full Syllabus</div>
                <h1 class="t-h1 font-bold text-[var(--foreground)] mt-1">完整課程大綱：主題、目標與知識點全覽</h1>

              </div>
              <button id="btn-reset-all" class="px-3 py-1.5 rounded-lg border t-xs font-semibold cursor-pointer ${
                state.confirmReset ? 'tint-error border-[var(--error)] text-[var(--error)]' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
              }">${state.confirmReset ? '再點一次確認重置所有紀錄' : '重置學習進度'}</button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-1">
              <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="font-mono t-h2 font-bold text-[var(--foreground)]">${CURRICULUM.length} 章</div>
                <div class="t-xs text-[var(--muted-foreground)]">Ch 00 – Ch 10 完整體系</div>
              </div>
              <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="font-mono t-h2 font-bold text-[var(--primary)]">${totalGoals} 項</div>
                <div class="t-xs text-[var(--muted-foreground)]">可勾選學習目標</div>
              </div>
              <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="font-mono t-h2 font-bold text-[var(--foreground)]">${totalKps} 個</div>
                <div class="t-xs text-[var(--muted-foreground)]">核心知識點詳解</div>
              </div>
              <div class="p-3.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="font-mono t-h2 font-bold text-[var(--success)]">${overall.pct}%</div>
                <div class="t-xs text-[var(--muted-foreground)]">${overall.done}/${overall.total} 總完成度（${totalLabs} 實作）</div>
              </div>
            </div>
          </header>

          ${PHASES.map(ph => `
            <section class="space-y-4">
              <h2 class="t-h3 font-bold text-[var(--foreground)] flex items-center gap-2">
                <span class="w-1.5 h-5 rounded-full bg-[var(--primary)] inline-block"></span>
                <span>${ph.label}</span>
              </h2>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${ph.chapters.map(cid => {
                  const ch = chapterMap[cid];
                  const st = getChapterStats(ch);
                  return `
                    <div class="lesson-card bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 flex flex-col justify-between gap-4">
                      <div class="space-y-3">
                        <div class="flex items-center justify-between gap-2">
                          <div class="flex items-center gap-2">
                            <span class="font-mono t-xs font-bold px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)]">${ch.num}</span>
                            <span class="t-xs text-[var(--muted-foreground)]">${ch.duration}</span>
                          </div>
                          <span class="font-mono t-xs font-semibold ${st.completed ? 'text-[var(--success)]' : 'text-[var(--muted-foreground)]'}">${st.completed ? '✓ 已完成' : `${st.done}/${st.total}`}</span>
                        </div>

                        <div>
                          <h3 class="t-h3 font-bold text-[var(--foreground)]">${ch.title}</h3>

    // =========================================================================
    // 8. VIEW C: FULL-COURSE EXAM & FLASHCARD CENTER
    // =========================================================================
    function getFilteredExamQuestions() {
      if (state.examFilter === 'all') return QUIZ_QUESTIONS;
      if (state.examFilter === 'wrong') {
        return QUIZ_QUESTIONS.filter(q => {
          const a = progress.quizAnswers[q.id];
          return a === undefined || a !== q.answer;
        });
      }
      return QUIZ_QUESTIONS.filter(q => q.chapterId === state.examFilter);
    }

    function getFilteredExamCards() {
      if (state.examFilter === 'all') return FLASHCARDS;
      if (state.examFilter === 'wrong') return FLASHCARDS.filter(f => progress.fcStatus[f.id] !== 'mastered');
      return FLASHCARDS.filter(f => f.chapterId === state.examFilter);
    }

    function renderExamView() {
      const answeredCount = Object.keys(progress.quizAnswers).length;
      const correctCount = QUIZ_QUESTIONS.filter(q => progress.quizAnswers[q.id] === q.answer).length;
      const acc = answeredCount ? Math.round((correctCount / answeredCount) * 100) : 0;
      const masteredFc = FLASHCARDS.filter(f => progress.fcStatus[f.id] === 'mastered').length;

      let bodyHtml = '';
      if (state.examMode === 'mcq') {
        const list = getFilteredExamQuestions();
        if (state.examIdx >= list.length) state.examIdx = 0;
        if (list.length === 0) {
          bodyHtml = `
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-8 text-center space-y-3">
              <div class="t-h3 font-bold text-[var(--foreground)]">目前篩選條件下沒有待加強題目！</div>
              <button data-exam-filter="all" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] t-sm font-semibold cursor-pointer">檢視全部 ${QUIZ_QUESTIONS.length} 道考題</button>
            </div>
          `;
        } else {
          const q = list[state.examIdx];
          const ch = chapterMap[q.chapterId];
          const picked = progress.quizAnswers[q.id];
          const answered = picked !== undefined;
          const isCorrect = answered && picked === q.answer;
          const letters = ['A', 'B', 'C', 'D'];

          bodyHtml = `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 sm:p-6 space-y-5">
                <div class="flex items-center justify-between gap-2 pb-3 border-b border-[var(--border)] flex-wrap">
                  <div class="flex items-center gap-2">
                    <span class="font-mono t-xs font-bold px-2.5 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)]">Q${state.examIdx + 1} / ${list.length}</span>
                    <button data-goto-chapter="${ch.id}" class="t-xs font-semibold text-[var(--link)] hover:underline cursor-pointer">${ch.num} ${ch.title.split(' (')[0]} ↗</button>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button data-exam-step="-1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">← 上一題</button>
                    <button data-exam-step="1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">下一題 →</button>
                  </div>
                </div>

                <h2 class="t-lead font-bold text-[var(--foreground)]">${escapeHtml(q.q)}</h2>

                <div class="space-y-2.5">
                  ${q.options.map((opt, oi) => {
                    let cls = 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)] text-[var(--foreground)]';
                    let tag = letters[oi];
                    if (answered) {
                      if (oi === q.answer) { cls = 'tint-success border-[var(--success)] font-semibold'; tag = `${letters[oi]} ✓`; }
                      else if (oi === picked) { cls = 'tint-error border-[var(--error)]'; tag = `${letters[oi]} ✗`; }
                      else { cls = 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)] opacity-60'; }
                    }
                    return `
                      <button data-answer-q="${q.id}|${oi}" class="w-full text-left p-3.5 rounded-xl border transition-colors flex items-start gap-3 cursor-pointer ${cls}">
                        <span class="font-mono t-xs font-bold px-2 py-0.5 rounded bg-[var(--card)] border border-[var(--border)] shrink-0 mt-0.5">${tag}</span>
                        <span class="t-body">${escapeHtml(opt)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>

                ${answered ? `
                  <div class="p-4 rounded-xl border space-y-2 ${isCorrect ? 'tint-success border-[var(--success)]' : 'tint-error border-[var(--error)]'}">
                    <div class="t-sm font-bold ${isCorrect ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${isCorrect ? '答對了！' : `答錯了 — 正確答案為 ${letters[q.answer]}`}</div>
                    <p class="t-sm text-[var(--foreground)]">${escapeHtml(q.explain)}</p>
                    <button data-goto-chapter="${ch.id}" class="t-xs font-semibold text-[var(--link)] hover:underline cursor-pointer">回到 ${ch.num} 複習該知識點 →</button>
                  </div>
                ` : ''}
              </div>

              <div class="lg:col-span-4 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-4 self-start">
                <div class="t-sm font-bold text-[var(--foreground)]">題號快速跳轉</div>
                <div class="grid grid-cols-6 gap-1.5">
                  ${list.map((item, i) => {
                    const p = progress.quizAnswers[item.id];
                    let cls = 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]';
                    if (p !== undefined) cls = p === item.answer ? 'tint-success border-[var(--success)] text-[var(--success)] font-bold' : 'tint-error border-[var(--error)] text-[var(--error)] font-bold';
                    if (i === state.examIdx) cls += ' ring-2 ring-[var(--primary)] text-[var(--foreground)] font-bold';
                    return `<button data-jump-exam="${i}" class="py-1.5 rounded-md border font-mono t-xs cursor-pointer ${cls}">${i + 1}</button>`;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      } else {
        const list = getFilteredExamCards();
        if (state.examFcIdx >= list.length) state.examFcIdx = 0;
        if (list.length === 0) {
          bodyHtml = `
            <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-8 text-center space-y-3">
              <div class="t-h3 font-bold text-[var(--foreground)]">所有記憶卡皆已標記為「已掌握」！</div>
              <button data-exam-filter="all" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] t-sm font-semibold cursor-pointer">檢視全部 ${FLASHCARDS.length} 張記憶卡</button>
            </div>
          `;
        } else {
          const fc = list[state.examFcIdx];
          const ch = chapterMap[fc.chapterId];
          const st = progress.fcStatus[fc.id];
          bodyHtml = `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 sm:p-6 space-y-5">
                <div class="flex items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
                  <div class="flex items-center gap-2">
                    <span class="font-mono t-xs font-bold px-2.5 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)]">C${state.examFcIdx + 1} / ${list.length}</span>
                    <button data-goto-chapter="${ch.id}" class="t-xs font-semibold text-[var(--link)] hover:underline cursor-pointer">${ch.num} ${ch.title.split(' (')[0]} ↗</button>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button data-exam-fc-step="-1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">← 上一張</button>
                    <button data-exam-fc-step="1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-xs font-semibold cursor-pointer">下一張 →</button>
                  </div>
                </div>

                <div id="exam-fc-box" role="button" tabindex="0" class="min-h-[220px] p-6 sm:p-8 rounded-xl border-2 flex flex-col items-center justify-center text-center cursor-pointer transition-colors ${
                  state.examFcFlipped ? 'tint-primary border-[var(--primary)]' : 'bg-[var(--background)] border-[var(--border)] hover:border-[var(--primary)]'
                }">
                  <span class="t-xs font-mono uppercase tracking-wider px-2.5 py-0.5 rounded mb-4 ${state.examFcFlipped ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'bg-[var(--secondary)] text-[var(--muted-foreground)]'}">${state.examFcFlipped ? '核心解答 · BACK' : '考點提問 · 點擊翻卡'}</span>
                  <p class="${state.examFcFlipped ? 't-lead text-[var(--foreground)]' : 't-h2 font-bold text-[var(--foreground)]'} max-w-2xl">${escapeHtml(state.examFcFlipped ? fc.back : fc.front)}</p>
                </div>

                <div class="flex items-center gap-2">
                  <button data-mark-fc="${fc.id}|review" class="flex-1 py-2.5 rounded-lg border t-sm font-semibold cursor-pointer ${st === 'review' ? 'tint-warning border-[var(--warning)]' : 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]'}">↺ 待複習</button>
                  <button id="btn-flip-exam-fc" class="px-5 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)] t-sm font-semibold cursor-pointer">${state.examFcFlipped ? '看題目' : '翻看答案'}</button>
                  <button data-mark-fc="${fc.id}|mastered" class="flex-1 py-2.5 rounded-lg border t-sm font-semibold cursor-pointer ${st === 'mastered' ? 'tint-success border-[var(--success)] text-[var(--success)]' : 'bg-[var(--background)] border-[var(--border)] hover:bg-[var(--secondary)]'}">✓ 已掌握</button>
                </div>
              </div>

              <div class="lg:col-span-4 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 space-y-4 self-start">
                <div class="t-sm font-bold text-[var(--foreground)]">記憶卡快速跳轉</div>
                <div class="grid grid-cols-6 gap-1.5">
                  ${list.map((item, i) => {
                    const s = progress.fcStatus[item.id];
                    let cls = 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]';
                    if (s === 'mastered') cls = 'tint-success border-[var(--success)] text-[var(--success)] font-bold';
                    else if (s === 'review') cls = 'tint-warning border-[var(--warning)] text-[var(--foreground)] font-bold';
                    if (i === state.examFcIdx) cls += ' ring-2 ring-[var(--primary)] text-[var(--foreground)] font-bold';
                    return `<button data-jump-exam-fc="${i}" class="py-1.5 rounded-md border font-mono t-xs cursor-pointer ${cls}">C${i + 1}</button>`;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-8 py-6 sm:py-9 space-y-6">
          <header class="pb-5 border-b border-[var(--border)] space-y-4">
            <div class="flex items-start justify-between gap-4 flex-wrap">
              <div>
                <h1 class="t-h1 font-bold text-[var(--foreground)]">AZ-400 全課程模擬測驗與記憶卡</h1>
                <p class="t-sm text-[var(--muted-foreground)] mt-1">涵蓋全 11 章情境單選題 (${QUIZ_QUESTIONS.length} 題) 與主動回憶閃卡 (${FLASHCARDS.length} 張)，作答自動記憶。</p>
              </div>
              <div class="flex items-center gap-3">
                <div class="px-3.5 py-2 rounded-xl bg-[var(--card)] border border-[var(--border)] text-center">
                  <div class="font-mono t-h3 font-bold text-[var(--foreground)]">${acc}%</div>
                  <div class="text-xs text-[var(--muted-foreground)]">答對率 (${correctCount}/${answeredCount})</div>
                </div>
                <div class="px-3.5 py-2 rounded-xl bg-[var(--card)] border border-[var(--border)] text-center">
                  <div class="font-mono t-h3 font-bold text-[var(--success)]">${masteredFc}/${FLASHCARDS.length}</div>
                  <div class="text-xs text-[var(--muted-foreground)]">已掌握閃卡</div>
                </div>
              </div>
            </div>

            <div class="flex items-center justify-between gap-3 flex-wrap">
              <div class="flex items-center gap-1 bg-[var(--card)] p-1 rounded-lg border border-[var(--border)]">
                <button data-exam-mode="mcq" class="px-3.5 py-1.5 rounded-md t-xs font-semibold cursor-pointer ${state.examMode === 'mcq' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">情境單選 (${QUIZ_QUESTIONS.length})</button>
                <button data-exam-mode="flashcard" class="px-3.5 py-1.5 rounded-md t-xs font-semibold cursor-pointer ${state.examMode === 'flashcard' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)]'}">記憶卡 (${FLASHCARDS.length})</button>
              </div>

              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full">
                <button data-exam-filter="all" class="px-2.5 py-1 rounded-md border t-xs font-semibold cursor-pointer shrink-0 ${state.examFilter === 'all' ? 'bg-[var(--secondary)] border-[var(--primary)] text-[var(--foreground)]' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)]'}">全部</button>
                <button data-exam-filter="wrong" class="px-2.5 py-1 rounded-md border t-xs font-semibold cursor-pointer shrink-0 ${state.examFilter === 'wrong' ? 'bg-[var(--secondary)] border-[var(--primary)] text-[var(--foreground)]' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)]'}">待加強 / 未答</button>
                ${CURRICULUM.filter(c => c.id !== 'ch00').map(c => `
                  <button data-exam-filter="${c.id}" class="px-2.5 py-1 rounded-md border font-mono t-xs font-semibold cursor-pointer shrink-0 ${state.examFilter === c.id ? 'bg-[var(--secondary)] border-[var(--primary)] text-[var(--foreground)]' : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)]'}">${c.num}</button>
                `).join('')}
              </div>
            </div>
          </header>

          ${bodyHtml}
        </div>
      `;
    }

    // =========================================================================
    // 9. SEARCH & MOBILE BOTTOM BAR
    // =========================================================================
    function renderSearchResults() {
      const box = document.getElementById('search-results');
      if (!box) return;
      const q = state.searchQuery.trim().toLowerCase();
      const hits = [];
      CURRICULUM.forEach(ch => {
        const chMatch = `${ch.num} ${ch.title} ${ch.subtitle} ${ch.topicWhat} ${ch.topicWhy}`.toLowerCase();
        if (!q || chMatch.includes(q)) {
          hits.push({ type: '章節', chId: ch.id, labIdx: 0, title: `${ch.num}｜${ch.title}`, desc: ch.subtitle });
        }
        if (q) {
          ch.knowledgePoints.forEach(kp => {
            if (`${kp.tag} ${kp.title} ${kp.summary} ${kp.takeaway}`.toLowerCase().includes(q)) {
              hits.push({ type: '知識點', chId: ch.id, labIdx: 0, title: `${ch.num} · ${kp.title}`, desc: kp.takeaway });
            }
          });
          ch.labs.forEach((l, li) => {
            if (`${l.label} ${l.steps.join(' ')} ${l.code}`.toLowerCase().includes(q)) {
              hits.push({ type: '實作', chId: ch.id, labIdx: li, title: `${ch.num} · ${l.label}`, desc: l.steps[0] });
            }
          });
        }
      });

      const shown = hits.slice(0, 12);
      if (shown.length === 0) {
        box.innerHTML = `<div class="p-6 text-center t-sm text-[var(--muted-foreground)]">找不到符合「${escapeHtml(state.searchQuery)}」的教學內容，試試搜尋 Playwright、Bicep、Gate、Managed Identity。</div>`;
        return;
      }
      box.innerHTML = shown.map(h => `
        <button data-search-jump="${h.chId}|${h.labIdx}" class="w-full text-left p-3 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition-colors cursor-pointer">
          <div class="flex items-center gap-2">
            <span class="t-xs font-mono font-bold px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--primary)] shrink-0">${h.type}</span>
            <span class="t-sm font-bold text-[var(--foreground)] truncate">${escapeHtml(h.title)}</span>
          </div>
          <p class="t-xs text-[var(--muted-foreground)] mt-1 truncate">${escapeHtml(h.desc)}</p>
        </button>
      `).join('');

      box.querySelectorAll('[data-search-jump]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [cid, li] = btn.getAttribute('data-search-jump').split('|');
          state.mode = 'chapter';
          state.chapterId = cid;
          state.labIdx = Number(li) || 0;
          closeSearch();
          render(true);
        });
      });
    }

    function openSearch() {
      state.searchOpen = true;
      document.getElementById('search-modal').classList.remove('hidden');
      const input = document.getElementById('search-input');
      input.value = state.searchQuery;
      renderSearchResults();
      setTimeout(() => input.focus(), 20);
    }

    function closeSearch() {
      state.searchOpen = false;
      document.getElementById('search-modal').classList.add('hidden');
    }

    function setDrawer(open) {
      state.drawerOpen = open;
      const backdrop = document.getElementById('mobile-drawer-backdrop');
      if (open) backdrop.classList.remove('hidden');
      else backdrop.classList.add('hidden');
    }

    // =========================================================================
    // 10. MASTER RENDER & EVENT BINDING
    // =========================================================================
    function render(scrollTop = false) {
      const overall = getOverallStats();
      const topLabel = document.getElementById('top-progress-label');
      const topFill = document.getElementById('top-progress-fill');
      if (topLabel) topLabel.textContent = `${overall.pct}%`;
      if (topFill) topFill.style.width = `${overall.pct}%`;

      // Highlight top mode buttons
      document.querySelectorAll('.mode-btn').forEach(btn => {
        const active = btn.getAttribute('data-mode') === state.mode;
        btn.className = `mode-btn ${btn.parentElement.classList.contains('md:hidden') ? 'flex-1 py-1.5 rounded-md text-xs' : 'px-3 py-1.5 rounded-md t-xs'} font-semibold transition-colors cursor-pointer ${
          active ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
        }`;
      });

      // Render desktop & mobile sidebars
      document.getElementById('desktop-sidebar').innerHTML = renderOutlineHtml(false);
      document.getElementById('mobile-drawer').innerHTML = renderOutlineHtml(true);

      // Render main content
      const main = document.getElementById('main-content');
      if (state.mode === 'chapter') main.innerHTML = renderChapterView();
      else if (state.mode === 'syllabus') main.innerHTML = renderSyllabusView();
      else main.innerHTML = renderExamView();

      if (scrollTop) main.scrollTop = 0;

      // Mobile sticky chapter bottom bar
      const mbar = document.getElementById('mobile-chapter-bar');
      if (state.mode === 'chapter') {
        mbar.classList.remove('hidden');
        const idx = CURRICULUM.findIndex(c => c.id === state.chapterId);
        const prev = idx > 0 ? CURRICULUM[idx - 1] : null;
        const next = idx < CURRICULUM.length - 1 ? CURRICULUM[idx + 1] : null;
        const curr = CURRICULUM[idx];
        mbar.innerHTML = `
          <button ${prev ? `data-goto-chapter="${prev.id}"` : 'disabled'} class="px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--card)] text-xs font-semibold disabled:opacity-35 cursor-pointer">← 上一章</button>
          <button id="btn-mbar-open-drawer" class="flex-1 py-2 px-3 rounded-lg bg-[var(--background)] border border-[var(--border)] text-xs font-bold text-[var(--foreground)] truncate cursor-pointer">${curr.num} · ${curr.title.split(' (')[0]} ▾</button>
          <button ${next ? `data-goto-chapter="${next.id}"` : 'data-mode="exam"'} class="px-3 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold cursor-pointer">${next ? '下一章 →' : '測驗 →'}</button>
        `;
      } else {
        mbar.classList.add('hidden');
      }

      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      // Mode switchers
      document.querySelectorAll('[data-mode]').forEach(el => {
        el.onclick = () => {
          state.mode = el.getAttribute('data-mode');
          state.confirmReset = false;
          setDrawer(false);
          render(true);
        };
      });

      // Jump to chapter
      document.querySelectorAll('[data-goto-chapter]').forEach(el => {
        el.onclick = () => {
          state.mode = 'chapter';
          state.chapterId = el.getAttribute('data-goto-chapter');
          state.labIdx = 0;
          state.chQuizIdx = 0;
          state.chFcIdx = 0;
          state.chFcFlipped = false;
          setDrawer(false);
          render(true);
        };
      });

      const closeDrawerBtn = document.getElementById('btn-close-drawer');
      if (closeDrawerBtn) closeDrawerBtn.onclick = () => setDrawer(false);
      const mbarDrawer = document.getElementById('btn-mbar-open-drawer');
      if (mbarDrawer) mbarDrawer.onclick = () => setDrawer(true);

      // Goals & Labs checkboxes
      document.querySelectorAll('[data-toggle-goal]').forEach(el => {
        el.onclick = () => {
          toggleGoal(el.getAttribute('data-toggle-goal'));
          render(false);
        };
      });

      document.querySelectorAll('[data-toggle-lab]').forEach(el => {
        el.onclick = () => {
          toggleLab(el.getAttribute('data-toggle-lab'));
          render(false);
        };
      });

      document.querySelectorAll('[data-toggle-whole-ch]').forEach(el => {
        el.onclick = () => {
          const ch = chapterMap[el.getAttribute('data-toggle-whole-ch')];
          if (ch) toggleWholeChapter(ch);
          render(false);
        };
      });

      document.querySelectorAll('[data-select-lab]').forEach(el => {
        el.onclick = () => {
          state.labIdx = Number(el.getAttribute('data-select-lab')) || 0;
          render(false);
        };
      });

      const copyBtn = document.getElementById('btn-copy-lab-code');
      if (copyBtn) {
        copyBtn.onclick = () => {
          const ch = chapterMap[state.chapterId];
          const lab = ch.labs[state.labIdx] || ch.labs[0];
          copyText(lab.code, copyBtn);
        };
      }

      // In-chapter quiz & flashcards
      document.querySelectorAll('[data-check-mode]').forEach(el => {
        el.onclick = () => {
          state.checkMode = el.getAttribute('data-check-mode');
          state.chFcFlipped = false;
          render(false);
        };
      });

      document.querySelectorAll('[data-ch-quiz-step]').forEach(el => {
        el.onclick = () => {
          const list = QUIZ_QUESTIONS.filter(q => q.chapterId === state.chapterId);
          const d = Number(el.getAttribute('data-ch-quiz-step'));
          state.chQuizIdx = (state.chQuizIdx + d + list.length) % list.length;
          render(false);
        };
      });

      document.querySelectorAll('[data-ch-fc-step]').forEach(el => {
        el.onclick = () => {
          const list = FLASHCARDS.filter(f => f.chapterId === state.chapterId);
          const d = Number(el.getAttribute('data-ch-fc-step'));
          state.chFcIdx = (state.chFcIdx + d + list.length) % list.length;
          state.chFcFlipped = false;
          render(false);
        };
      });

      const flipCh = () => { state.chFcFlipped = !state.chFcFlipped; render(false); };
      const chFcBox = document.getElementById('ch-fc-box');
      if (chFcBox) chFcBox.onclick = flipCh;
      const btnFlipCh = document.getElementById('btn-flip-ch-fc');
      if (btnFlipCh) btnFlipCh.onclick = flipCh;

      // Quiz answer selection (both in-chapter and exam mode)
      document.querySelectorAll('[data-answer-q]').forEach(el => {
        el.onclick = () => {
          const [qid, optIdx] = el.getAttribute('data-answer-q').split('|');
          progress.quizAnswers[qid] = Number(optIdx);
          saveProgress();
          render(false);
        };
      });

      // Flashcard rating (both in-chapter and exam mode)
      document.querySelectorAll('[data-mark-fc]').forEach(el => {
        el.onclick = () => {
          const [fid, status] = el.getAttribute('data-mark-fc').split('|');
          progress.fcStatus[fid] = status;
          saveProgress();
          render(false);
        };
      });

      // Exam mode controls
      document.querySelectorAll('[data-exam-mode]').forEach(el => {
        el.onclick = () => {
          state.examMode = el.getAttribute('data-exam-mode');
          state.examFcFlipped = false;
          render(false);
        };
      });

      document.querySelectorAll('[data-exam-filter]').forEach(el => {
        el.onclick = () => {
          state.examFilter = el.getAttribute('data-exam-filter');
          state.examIdx = 0;
          state.examFcIdx = 0;
          state.examFcFlipped = false;
          render(false);
        };
      });

      document.querySelectorAll('[data-exam-step]').forEach(el => {
        el.onclick = () => {
          const list = getFilteredExamQuestions();
          if (!list.length) return;
          state.examIdx = (state.examIdx + Number(el.getAttribute('data-exam-step')) + list.length) % list.length;
          render(false);
        };
      });

      document.querySelectorAll('[data-jump-exam]').forEach(el => {
        el.onclick = () => {
          state.examIdx = Number(el.getAttribute('data-jump-exam')) || 0;
          render(false);
        };
      });

      document.querySelectorAll('[data-exam-fc-step]').forEach(el => {
        el.onclick = () => {
          const list = getFilteredExamCards();
          if (!list.length) return;
          state.examFcIdx = (state.examFcIdx + Number(el.getAttribute('data-exam-fc-step')) + list.length) % list.length;
          state.examFcFlipped = false;
          render(false);
        };
      });

      document.querySelectorAll('[data-jump-exam-fc]').forEach(el => {
        el.onclick = () => {
          state.examFcIdx = Number(el.getAttribute('data-jump-exam-fc')) || 0;
          state.examFcFlipped = false;
          render(false);
        };
      });

      const flipExam = () => { state.examFcFlipped = !state.examFcFlipped; render(false); };
      const examFcBox = document.getElementById('exam-fc-box');
      if (examFcBox) examFcBox.onclick = flipExam;
      const btnFlipExam = document.getElementById('btn-flip-exam-fc');
      if (btnFlipExam) btnFlipExam.onclick = flipExam;

      // Reset all progress (2-step confirm)
      const resetBtn = document.getElementById('btn-reset-all');
      if (resetBtn) {
        resetBtn.onclick = () => {
          if (!state.confirmReset) {
            state.confirmReset = true;
            render(false);
          } else {
            progress.doneGoals = [];
            progress.doneLabs = [];
            progress.quizAnswers = {};
            progress.fcStatus = {};
            saveProgress();
            state.confirmReset = false;
            render(false);
          }
        };
      }
    }

    // Static top bar events
    document.getElementById('btn-brand-home').addEventListener('click', () => {
      state.mode = 'syllabus';
      render(true);
    });
    document.getElementById('btn-top-progress').addEventListener('click', () => {
      state.mode = 'syllabus';
      render(true);
    });
    document.getElementById('btn-font-size').addEventListener('click', () => {
      const idx = FONT_STEPS.findIndex(f => f.id === state.fontSize);
      const next = FONT_STEPS[(idx + 1) % FONT_STEPS.length];
      applyFontSize(next.id);
    });
    document.getElementById('btn-mobile-drawer').addEventListener('click', () => setDrawer(true));
    document.getElementById('mobile-drawer-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'mobile-drawer-backdrop') setDrawer(false);
    });
    document.getElementById('btn-open-search').addEventListener('click', openSearch);
    document.getElementById('btn-close-search').addEventListener('click', closeSearch);
    document.getElementById('search-modal').addEventListener('click', (e) => {
      if (e.target.id === 'search-modal') closeSearch();
    });
    document.getElementById('search-input').addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      renderSearchResults();
    });

    // Keyboard shortcuts (/ for search, Esc to close)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (state.searchOpen) closeSearch();
        if (state.drawerOpen) setDrawer(false);
        return;
      }
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === '/') {
        e.preventDefault();
        openSearch();
      }
    });

    // Standalone Light/Dark Theme Management
    const THEME_KEY = "az400_devops_portal_theme_v1";
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const btn = document.getElementById("btn-toggle-theme");
      if (btn) btn.textContent = theme === "dark" ? "淺色" : "深色";
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
      if (saved === "dark" || saved === "light") {
        applyTheme(saved);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }
      const btn = document.getElementById("btn-toggle-theme");
      if (btn) {
        btn.addEventListener("click", () => {
          const curr = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
          applyTheme(curr === "dark" ? "light" : "dark");
        });
      }
    })();

    // Boot
    initFontSize();
    render(true);
  </script>
</body>
</html>
