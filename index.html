<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ-400 DevOps 專業知識中樞｜零捲動互動知識網</title>
  <meta name="description" content="AZ-400 Azure DevOps 實戰課程完整知識體系，涵蓋 10 大章節、32 項實作主題、DevOps 八階段定位與上下游相依性拓撲，採用零捲動單頁工作台設計。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8fafc;
      --sidebar: #f1f5f9;
      --card: #ffffff;
      --content: #ffffff;
      --border: #e2e8f0;
      --card-border: #e2e8f0;
      --foreground: #0f172a;
      --muted-foreground: #475569;
      --placeholder: #94a3b8;
      --code-foreground: #0f172a;
      --primary: #0369a1;
      --primary-foreground: #ffffff;
      --secondary: #e2e8f0;
      --secondary-foreground: #0f172a;
      --accent: #e0f2fe;
      --link: #0284c7;
      --success: #15803d;
      --warning: #b45309;
      --error: #dc2626;
      --chart-1: #0284c7;
      --chart-2: #0d9488;
      --chart-3: #d97706;
      --chart-4: #e11d48;
      --chart-5: #2563eb;
      --chart-6: #059669;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --background: #0b1120;
      --sidebar: #0f172a;
      --card: #131c31;
      --content: #131c31;
      --border: #23304a;
      --card-border: #23304a;
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --placeholder: #64748b;
      --code-foreground: #e2e8f0;
      --primary: #38bdf8;
      --primary-foreground: #082f49;
      --secondary: #1e293b;
      --secondary-foreground: #f1f5f9;
      --accent: #1e293b;
      --link: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #f87171;
      --chart-1: #38bdf8;
      --chart-2: #2dd4bf;
      --chart-3: #fbbf24;
      --chart-4: #fb7185;
      --chart-5: #60a5fa;
      --chart-6: #34d399;
      color-scheme: dark;
    }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    * {
      box-sizing: border-box;
    }

    /* Study-optimized scalable typography (defaults to comfortable Large 'lg') */
    body[data-font="md"] {
      --fs-micro: 13px;
      --fs-ui: 14px;
      --fs-body: 15px;
      --fs-lead: 16.5px;
      --fs-title: 18px;
      --fs-hero: 21px;
      --fs-code: 14px;
    }
    body[data-font="lg"] {
      --fs-micro: 13.5px;
      --fs-ui: 14.5px;
      --fs-body: 16px;
      --fs-lead: 17.5px;
      --fs-title: 20px;
      --fs-hero: 23px;
      --fs-code: 15px;
    }
    body[data-font="xl"] {
      --fs-micro: 14.5px;
      --fs-ui: 15.5px;
      --fs-body: 17.5px;
      --fs-lead: 19px;
      --fs-title: 22px;
      --fs-hero: 25px;
      --fs-code: 16px;
    }

    .t-micro { font-size: var(--fs-micro); line-height: 1.45; }
    .t-ui    { font-size: var(--fs-ui);    line-height: 1.45; }
    .t-body  { font-size: var(--fs-body);  line-height: 1.65; }
    .t-lead  { font-size: var(--fs-lead);  line-height: 1.65; }
    .t-title { font-size: var(--fs-title); line-height: 1.35; }
    .t-hero  { font-size: var(--fs-hero);  line-height: 1.45; }

    .tint-primary { background-color: color-mix(in srgb, var(--primary) 12%, transparent); }
    .tint-success { background-color: color-mix(in srgb, var(--success) 13%, transparent); }
    .tint-warning { background-color: color-mix(in srgb, var(--warning) 14%, transparent); }
    .tint-error   { background-color: color-mix(in srgb, var(--error) 12%, transparent); }
    .tint-c1 { background-color: color-mix(in srgb, var(--chart-1) 14%, transparent); }
    .tint-c2 { background-color: color-mix(in srgb, var(--chart-2) 14%, transparent); }
    .tint-c3 { background-color: color-mix(in srgb, var(--chart-3) 14%, transparent); }
    .tint-c4 { background-color: color-mix(in srgb, var(--chart-4) 14%, transparent); }
    .tint-c5 { background-color: color-mix(in srgb, var(--chart-5) 14%, transparent); }
    .tint-c6 { background-color: color-mix(in srgb, var(--chart-6) 14%, transparent); }

    .stage-pill {
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .stage-pill:hover {
      transform: translateY(-1px);
    }
    .dag-node {
      cursor: pointer;
      transition: opacity 180ms ease;
    }
    .dag-edge {
      transition: opacity 180ms ease, stroke-width 180ms ease;
    }
    .kbd-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--foreground);
    }
    .code-block {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: var(--fs-code);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body data-font="lg" class="h-screen w-screen overflow-hidden bg-[var(--background)] text-[var(--foreground)] antialiased flex flex-col select-none">

  <!-- TOP NAVIGATION BAR -->
  <header class="h-14 shrink-0 border-b border-[var(--border)] bg-[var(--sidebar)] px-4 flex items-center justify-between gap-2.5">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] flex items-center justify-center font-bold text-sm shrink-0">
        AZ
      </div>
      <div class="flex items-baseline gap-2 min-w-0">
        <h1 class="text-base font-bold tracking-tight text-[var(--foreground)] truncate">AZ-400 DevOps 知識中樞</h1>
      </div>
    </div>

    <!-- 5 PRIMARY MODE SWITCHERS -->
    <nav id="main-nav" aria-label="主要視圖切換" class="flex items-center gap-1 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)] shrink-0">
      <button data-view="stages" class="nav-btn px-3 py-1.5 rounded-md t-ui font-medium transition-colors flex items-center gap-1.5">
        <span>1</span><span>階段地圖</span>
      </button>
      <button data-view="chapters" class="nav-btn px-3 py-1.5 rounded-md t-ui font-medium transition-colors flex items-center gap-1.5">
        <span>2</span><span>章節學習</span>
      </button>
      <button data-view="dag" class="nav-btn px-3 py-1.5 rounded-md t-ui font-medium transition-colors flex items-center gap-1.5">
        <span>3</span><span>相依拓撲</span>
      </button>
      <button data-view="reference" class="nav-btn px-3 py-1.5 rounded-md t-ui font-medium transition-colors flex items-center gap-1.5">
        <span>4</span><span>速查解剖</span>
      </button>
      <button data-view="quiz" class="nav-btn px-3 py-1.5 rounded-md t-ui font-medium transition-colors flex items-center gap-1.5">
        <span>5</span><span>考題測驗</span>
      </button>
    </nav>

    <!-- RIGHT ACTIONS: FONT SIZE, PROGRESS, CD SHORTCUT & SEARCH -->
    <div class="flex items-center gap-2 shrink-0">
      <button id="btn-font-size" title="切換閱讀字體大小（標準 / 大 / 特大）" class="px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui font-medium text-[var(--foreground)] transition-colors cursor-pointer">
        字級：大
      </button>
      <button id="btn-header-progress" title="檢視全課程學習進度與勾選矩陣" class="px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui flex items-center gap-2 transition-colors cursor-pointer">
        <span id="header-progress-text" class="font-mono font-semibold text-[var(--foreground)]">0/32</span>
        <span class="w-12 h-2 rounded-full bg-[var(--secondary)] overflow-hidden hidden sm:inline-block">
          <span id="header-progress-bar" class="block h-full rounded-full transition-all" style="width: 0%; background-color: var(--success);"></span>
        </span>
      </button>
      <button id="btn-jump-cd" class="hidden xl:inline-flex px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui font-medium text-[var(--foreground)] transition-colors cursor-pointer">
        直達 CD
      </button>
      <button id="btn-toggle-theme" title="切換淺色 / 深色主題" class="px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui font-medium text-[var(--foreground)] transition-colors cursor-pointer">深色</button>
      <button id="btn-open-search" class="px-2.5 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui text-[var(--muted-foreground)] flex items-center gap-1.5 transition-colors cursor-pointer">
        <span class="hidden lg:inline">搜尋</span>
        <span class="kbd-chip">/</span>
      </button>
    </div>
  </header>

  <!-- MAIN ZERO-SCROLL WORKSPACE -->
  <main id="workspace" class="flex-1 min-h-0 overflow-hidden p-3.5 flex flex-col">
    <!-- Rendered dynamically by view -->
  </main>

  <!-- COMPACT KEYBOARD & STATUS FOOTER -->
  <footer class="h-8 shrink-0 border-t border-[var(--border)] bg-[var(--sidebar)] px-4 flex items-center justify-between t-micro text-[var(--muted-foreground)]">
    <div class="flex items-center gap-3 truncate">
      <span><span class="kbd-chip">1</span>-<span class="kbd-chip">5</span> 視圖</span>
      <span class="hidden sm:inline"><span class="kbd-chip">↑</span><span class="kbd-chip">↓</span> 章節</span>
      <span class="hidden sm:inline"><span class="kbd-chip">←</span><span class="kbd-chip">→</span> 翻頁</span>
      <span class="hidden md:inline"><span class="kbd-chip">Space</span> 勾選/翻卡</span>
      <span class="hidden lg:inline"><span class="kbd-chip">A</span>-<span class="kbd-chip">D</span> 作答</span>
      <span><span class="kbd-chip">/</span> 搜尋</span>
    </div>
    <div id="status-readout" class="truncate text-right font-mono t-micro text-[var(--muted-foreground)]">
      零捲動學習模式 · 就緒
    </div>
  </footer>

  <!-- QUICK SEARCH MODAL (ZERO-SCROLL OVERLAY) -->
  <div id="search-modal" class="hidden fixed inset-0 z-50 flex items-start justify-center pt-16 px-4" style="background-color: color-mix(in srgb, var(--background) 78%, transparent); backdrop-filter: blur(4px);">
    <div class="w-full max-w-3xl bg-[var(--card)] border border-[var(--border)] rounded-xl shadow-xl overflow-hidden flex flex-col">
      <div class="p-3.5 border-b border-[var(--border)] flex items-center gap-3">
        <span class="t-ui font-semibold text-[var(--muted-foreground)]">搜尋</span>
        <input id="search-input" type="text" placeholder="輸入關鍵字，例如：Bicep、Release Gate、SonarCloud、Slot、YAML、Key Vault、Lab 23..." class="flex-1 bg-transparent t-body text-[var(--foreground)] placeholder:text-[var(--placeholder)] outline-none select-text" />
        <button id="btn-close-search" class="kbd-chip cursor-pointer">ESC</button>
      </div>
      <div id="search-results" class="p-3 grid grid-cols-2 gap-2.5">
        <!-- Up to 6 top instant matches -->
      </div>
      <div class="px-3.5 py-2.5 border-t border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between t-micro text-[var(--muted-foreground)]">
        <span id="search-count">顯示最相關前 6 筆，無需捲動</span>
        <span>點選結果直接跳轉至對應章節與 Lab</span>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. STRUCTURED AZ-400 DEVOPS KNOWLEDGE DATASET (SANITIZED & COMPLETE)
    // =========================================================================
    const DEVOPS_STAGES = [
      {
        id: 'plan',
        order: 1,
        en: 'Plan',
        zh: '規劃與治理',
        colorVar: '--chart-1',
        tintClass: 'tint-c1',
        summary: '定義商業價值、拆解 Backlog / User Story、估算團隊產能，並在設計初期導入威脅建模與文件協作。',
        upstream: ['monitor'],
        downstream: ['code', 'release'],
        upstreamNote: '接收 Monitor 階段的系統指標與缺陷回饋，轉化為新 PBI / Bug。',
        downstreamNote: '產出可追蹤的 Task 供 Code 階段開分支，並提供 Shared Query 給 Release Gate 自動驗證。',
        crossCutting: ['Scrum 敏捷治理', '威脅建模 (設計端左移)', '環境與組織初始化'],
        checklist: [
          '所有程式碼變更皆能回溯至 Azure Boards Work Item (PBI / Task)',
          '迭代開始前完成 Team Capacity 設定與 3-5 個細粒度 Task 拆解',
          '在系統設計階段透過 Threat Modeling Tool 識別高風險資料流'
        ],
        metrics: ['Sprint Burndown', 'Velocity / Capacity', 'Lead Time']
      },
      {
        id: 'code',
        order: 2,
        en: 'Code',
        zh: '開發與版控',
        colorVar: '--chart-2',
        tintClass: 'tint-c2',
        summary: '以短生命週期 Feature Branch 搭配 Pull Request 進行協作，將程式碼、Pipeline YAML、IaC 範本全面版本化。',
        upstream: ['plan'],
        downstream: ['build', 'test'],
        upstreamNote: '從 Azure Boards 的 Task 直接建立 Feature Branch，保持小批次開發。',
        downstreamNote: 'Push 與發起 PR 立即觸發 PR-CI、Build Validation 與安全靜態檢查。',
        crossCutting: ['Git Pre-commit Hook 本機左移', 'Pipeline-as-Code (YAML)', 'IaC (ARM / Bicep) 版控'],
        checklist: [
          '初始化 Repo 後立即建立 .gitignore，杜絕 bin/obj 與憑證入版控',
          '分支關聯 Task（而非 PBI），確保 PR 合併時精準自動關閉任務',
          '套用 GitHub Flow / Trunk-Based 思維，避免長壽命分支引發 Merge Hell'
        ],
        metrics: ['PR Size & Review Time', 'Branch Lifespan', 'Commit Hygiene']
      },
      {
        id: 'build',
        order: 3,
        en: 'Build',
        zh: '持續整合建置',
        colorVar: '--chart-3',
        tintClass: 'tint-c3',
        summary: '透過雲端或自託管 Agent 自動化執行 Restore、Compile、封裝 Artifact (.zip) 與私有 NuGet 套件發佈。',
        upstream: ['code'],
        downstream: ['test', 'release'],
        upstreamNote: '監聽 main 分支 CI Trigger 或 PR-CI Build Validation 事件自動啟動。',
        downstreamNote: '輸出不可變成品 (Build Artifact / .nupkg)，供 Test 驗證與 Release 多環境部署。',
        crossCutting: ['Self-Hosted Linux Agent', 'Azure Artifacts Private Feed', 'Key Vault Variable Groups'],
        checklist: [
          '區分 PR-CI（驗證用、無 CI Trigger）與主線 CI（合併後正式產出成品）',
          '使用 YAML Pipeline 將建置流程納入版控並可跨分支演進',
          '大型共用模組抽離為版本化 NuGet 套件，取代緊耦合 Project Reference'
        ],
        metrics: ['Build Success Rate', 'Build Duration', 'Artifact Integrity']
      },
      {
        id: 'test',
        order: 4,
        en: 'Test',
        zh: '自動化測試與安全掃描',
        colorVar: '--chart-4',
        tintClass: 'tint-c4',
        summary: '在合併前與建置中落實品質安全左移：結合單元測試、GPT AI Code Review、SonarCloud SAST 與 Mend SCA 掃描。',
        upstream: ['code', 'build'],
        downstream: ['release'],
        upstreamNote: '由 PR Build Validation 與 CI 管線觸發，在進入 main 分支前攔截缺陷。',
        downstreamNote: '品質門檻 (Quality Gate) 全數通過後，成品才具備進入 Release 階段的資格。',
        crossCutting: ['SAST 靜態分析 (SonarCloud)', 'SCA 套件漏洞掃描 (Mend)', 'AI 自動化 PR Review'],
        checklist: [
          '於 main 分支設定 Branch Policy 強制執行 PR-CI Build Validation',
          '配置 Repo 與 OAuth Token 權限讓 GPT 自動於 PR 留言指出潛在 Bug',
          '整合 SAST + SCA 同時涵蓋自研程式碼品質與第三方開源套件 CVE 風險'
        ],
        metrics: ['Quality Gate Pass Rate', 'CVE Vulnerability Count', 'Test Pass Rate']
      },
      {
        id: 'release',
        order: 5,
        en: 'Release',
        zh: '發布治理與閘門',
        colorVar: '--chart-5',
        tintClass: 'tint-c5',
        summary: '編排 Dev → QA → Prod 多環境遞進策略，結合人工簽核 (Approvals)、自動化 Release Gates 與 IaC 環境一致性佈建。',
        upstream: ['build', 'test', 'plan'],
        downstream: ['deploy'],
        upstreamNote: '匯集 Build 成品、Test 品質驗證與 Plan 的 Shared Query (Bug 數統計)。',
        downstreamNote: '通過所有 Approvals / Gates 後，放行至 Deploy 階段執行目標環境部署。',
        crossCutting: ['ARM / Bicep IaC 環境佈建', 'Multi-Stage YAML Environments', 'NuGet Feed 版本發佈'],
        checklist: [
          '以自動化 Release Gate（如 Active Bugs < 5）降低人工簽核等待瓶頸',
          '設定 Release Gate 時務必開放對應 Shared Query 的讀取權限',
          '利用 Multi-Stage YAML + ADO Environments 統一控管審批與部署歷史'
        ],
        metrics: ['Deployment Frequency', 'Gate Approval Lead Time', 'Change Failure Rate']
      },
      {
        id: 'deploy',
        order: 6,
        en: 'Deploy',
        zh: '自動化部署執行',
        colorVar: '--chart-6',
        tintClass: 'tint-c6',
        summary: '將驗證通過的成品以零停機策略交付至目標基礎設施：包含 Azure Web App、Staging Slot 藍綠切換與 VM/IIS Deployment Groups。',
        upstream: ['release'],
        downstream: ['operate'],
        upstreamNote: '接收 Release 階段放行指令、已佈建的 IaC 環境與 Key Vault 機密注入。',
        downstreamNote: '新版服務正式承接流量後，移交 Operate 階段進行動態組態與功能開關控管。',
        crossCutting: ['Blue-Green Slot Swap', 'Deployment Groups (VM/IIS)', 'Key Vault / Managed Identity'],
        checklist: [
          '採用 Staging Slot 驗證後再 Swap 至 Production，實現零停機與秒級回滾',
          '部署傳統 VM / IIS 叢集時使用 Deployment Group 註冊腳本批次滾動發布',
          '使用 Service Connection 與 Managed Identity 消除硬編碼部署憑證'
        ],
        metrics: ['Zero-Downtime Swap', 'Rollback MTTR', 'Environment Parity']
      },
      {
        id: 'operate',
        order: 7,
        en: 'Operate',
        zh: '維運與動態控制',
        colorVar: '--primary',
        tintClass: 'tint-primary',
        summary: '於執行期透過 Azure App Configuration、Feature Toggle 與 Managed Identity 達成無重啟調參、安全無金鑰存取與即時灰度開關。',
        upstream: ['deploy'],
        downstream: ['monitor'],
        upstreamNote: '接手 Deploy 完成的線上服務，掌控功能開放時機與執行期組態。',
        downstreamNote: '線上運行狀態、功能開關成效與安全稽核資料持續輸出至 Monitor 階段。',
        crossCutting: ['Deployment ≠ Release (Feature Flags)', 'Passwordless (Managed Identity + RBAC)', '集中化組態'],
        checklist: [
          '以 Feature Toggle 分離「程式碼部署」與「業務功能上線」，隨時秒級熔斷',
          '依據業務敏感度設定 Feature Flag 的 CacheExpirationInterval',
          '正式環境全面使用 DefaultAzureCredential + Managed Identity 取代 API Key'
        ],
        metrics: ['Config Refresh Latency', 'Feature Rollout Control', 'Zero Secret Leakage']
      },
      {
        id: 'monitor',
        order: 8,
        en: 'Monitor',
        zh: '可視化監控與回饋',
        colorVar: '--success',
        tintClass: 'tint-success',
        summary: '透過數位儀表板、CFD 累積流量圖、Cycle Time / Lead Time 與建置歷史洞察交付瓶頸，將回饋閉環送回 Plan 階段持續改善。',
        upstream: ['operate', 'build', 'deploy'],

        front: 'Multi-Stage YAML Pipeline 中，deployment job 的 environment 欄位有什麼關鍵用途？',
        back: '它將 YAML 部署階段直接綁定至 Azure DevOps Environments（如 production），讓團隊能在 UI 集中配置該環境的 Approvals 人工簽核、自動 Checks/Gates 並完整保留每次部署的稽核紀錄。'
      }
    ];

    // =========================================================================
    // 3. PERSISTENT STORAGE, APPLICATION STATE & HELPERS
    // =========================================================================
    const STORAGE_KEY = 'az400_devops_portal_progress_v1';

    function loadProgress() {
      const fallback = { completedLabs: [], quizAnswers: {}, flashcardStatus: {} };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          completedLabs: Array.isArray(parsed.completedLabs) ? parsed.completedLabs : [],
          quizAnswers: parsed.quizAnswers && typeof parsed.quizAnswers === 'object' ? parsed.quizAnswers : {},
          flashcardStatus: parsed.flashcardStatus && typeof parsed.flashcardStatus === 'object' ? parsed.flashcardStatus : {}
        };
      } catch (e) {
        return fallback;
      }
    }

    const progress = loadProgress();

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      } catch (e) {
        // Ignore storage quota or sandbox restrictions gracefully
      }
    }

    const state = {
      view: 'stages',             // 'stages' | 'chapters' | 'dag' | 'reference' | 'quiz'
      selectedStageId: 'release', // Highlight CD/Release initially
      stagePage: 0,
      stageInfoTab: 'flow',       // 'flow' | 'checklist'
      selectedChapterId: 'ch09',
      selectedLabIndex: 0,
      labDetailTab: 'points',     // 'points' | 'steps' | 'code' | 'insight'
      chapterDepTab: 'upstream',  // 'upstream' | 'downstream'
      dagSelectedId: 'ch09',
      dagFilter: 'all',           // 'all' | 'ci' | 'cd' | 'agile' | 'sec'
      dagDepTab: 'upstream',      // 'upstream' | 'downstream'
      refTab: 'compare',          // 'compare' | 'yaml' | 'sec' | 'cli' | 'index'
      compareIdx: 0,
      yamlIdx: 0,
      secLayerIdx: 0,
      cliIdx: 0,
      // Quiz & Flashcard state
      quizMode: 'mcq',            // 'mcq' | 'flashcard'
      quizFilter: 'all',          // 'all' | 'plan_code' | 'ci_test' | 'sec_iac_pkg' | 'cd_deploy' | 'review'
      quizIdx: 0,
      fcIdx: 0,
      fcFlipped: false,
      confirmResetProgress: false,
      confirmResetQuiz: false,
      fontSize: 'lg',             // 'md' | 'lg' | 'xl'
      searchOpen: false
    };

    const stageMap = Object.fromEntries(DEVOPS_STAGES.map(s => [s.id, s]));
    const chapterMap = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));

    // Build flat searchable index of all 32 Labs/Topics
    const ALL_LABS = [];
    CHAPTERS.forEach(ch => {
      ch.labs.forEach((lab, idx) => {
        ALL_LABS.push({
          chapterId: ch.id,
          chapterNum: ch.num,
          chapterTitle: ch.title,
          labIndex: idx,
          labId: lab.id,
          label: lab.label,
          stages: lab.stages,
          points: lab.points,
          searchText: `${ch.num} ${ch.title} ${ch.short} ${lab.label} ${lab.stages.join(' ')} ${lab.points.join(' ')} ${ch.tech.join(' ')}`.toLowerCase()
        });
      });
    });

    function isLabDone(labId) {
      return progress.completedLabs.includes(labId);
    }

    function toggleLabDone(labId) {
      const idx = progress.completedLabs.indexOf(labId);
      if (idx >= 0) progress.completedLabs.splice(idx, 1);
      else progress.completedLabs.push(labId);
      state.confirmResetProgress = false;
      saveProgress();
      render();
    }

    function getChapterProgress(ch) {
      const done = ch.labs.filter(l => isLabDone(l.id)).length;
      return { done, total: ch.labs.length, allDone: done === ch.labs.length };
    }

    function toggleChapterAllDone(chId) {
      const ch = chapterMap[chId];
      if (!ch) return;
      const { allDone } = getChapterProgress(ch);
      ch.labs.forEach(l => {
        const idx = progress.completedLabs.indexOf(l.id);
        if (allDone) {
          if (idx >= 0) progress.completedLabs.splice(idx, 1);
        } else {
          if (idx < 0) progress.completedLabs.push(l.id);
        }
      });
      state.confirmResetProgress = false;
      saveProgress();
      render();
    }

    function getOverallProgress() {
      const total = ALL_LABS.length;
      const done = ALL_LABS.filter(l => isLabDone(l.labId)).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      return { done, total, pct };
    }

    function getFilteredQuestions() {
      if (state.quizFilter === 'all') return QUIZ_QUESTIONS;
      if (state.quizFilter === 'review') {
        return QUIZ_QUESTIONS.filter(q => {
          const picked = progress.quizAnswers[q.id];
          return picked !== undefined && picked !== q.answer;
        });
      }
      return QUIZ_QUESTIONS.filter(q => q.domain === state.quizFilter);
    }

    function getFilteredFlashcards() {
      if (state.quizFilter === 'all') return FLASHCARDS;
      if (state.quizFilter === 'review') {
        return FLASHCARDS.filter(fc => progress.flashcardStatus[fc.id] === 'review' || !progress.flashcardStatus[fc.id]);
      }
      return FLASHCARDS.filter(fc => fc.domain === state.quizFilter);
    }

    function getQuizStats() {
      let answered = 0;
      let correct = 0;
      QUIZ_QUESTIONS.forEach(q => {
        if (progress.quizAnswers[q.id] !== undefined) {
          answered++;
          if (progress.quizAnswers[q.id] === q.answer) correct++;
        }
      });
      const accuracy = answered ? Math.round((correct / answered) * 100) : 0;
      const fcMastered = FLASHCARDS.filter(fc => progress.flashcardStatus[fc.id] === 'mastered').length;
      const fcReview = FLASHCARDS.filter(fc => progress.flashcardStatus[fc.id] === 'review').length;
      return { answered, correct, totalQ: QUIZ_QUESTIONS.length, accuracy, fcMastered, fcReview, totalFc: FLASHCARDS.length };
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function stageBadgeHtml(stageId, clickable = false) {
      const st = stageMap[stageId];
      if (!st) return '';
      const cls = `inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md t-micro font-medium border border-[var(--border)] ${st.tintClass} text-[var(--foreground)] ${clickable ? 'cursor-pointer hover:opacity-80' : ''}`;
      const attr = clickable ? `data-jump-stage="${st.id}"` : '';
      return `<span ${attr} class="${cls}"><span class="w-2 h-2 rounded-full" style="background-color: var(${st.colorVar})"></span>${st.en}</span>`;
    }

    function jumpToChapterLab(chapterId, labIndex = 0) {
      state.view = 'chapters';
      state.selectedChapterId = chapterId;
      const ch = chapterMap[chapterId];
      state.selectedLabIndex = Math.min(labIndex, (ch?.labs.length || 1) - 1);
      state.labDetailTab = 'points';
      state.chapterDepTab = ch.upstream.length > 0 ? 'upstream' : 'downstream';
      closeSearch();
      render();
    }

    function jumpToStage(stageId) {
      state.view = 'stages';
      state.selectedStageId = stageId;
      state.stagePage = 0;
      render();
    }

    function copyText(text, btnEl) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          const orig = btnEl.textContent;
          btnEl.textContent = '已複製 ✓';
          setTimeout(() => { btnEl.textContent = orig; }, 1200);
        });
      }
    }

    // Font Size Controller (md / lg / xl, persisted in localStorage)
    const FONT_KEY = 'az400_devops_portal_font_v1';
    const FONT_LABELS = { md: '字級：標準', lg: '字級：大', xl: '字級：特大' };
    const FONT_ORDER = ['md', 'lg', 'xl'];

    function applyFontSize(sz) {
      const valid = FONT_ORDER.includes(sz) ? sz : 'lg';
      state.fontSize = valid;
      document.body.setAttribute('data-font', valid);
      const btn = document.getElementById('btn-font-size');
      if (btn) btn.textContent = FONT_LABELS[valid];
      try { localStorage.setItem(FONT_KEY, valid); } catch (e) {}
    }

    (function initFontSize() {
      let saved = 'lg';
      try { saved = localStorage.getItem(FONT_KEY) || 'lg'; } catch (e) {}
      applyFontSize(saved);
    })();

    // =========================================================================
    // 4. VIEW 1: DEVOPS 8-STAGE LIFECYCLE MAP (SPACIOUS 2-COLUMN STUDY LAYOUT)
    // =========================================================================
    function renderStagesView() {
      const stage = stageMap[state.selectedStageId];
      const stageLabs = ALL_LABS.filter(item => item.stages.includes(stage.id));
      const stageChapters = CHAPTERS.filter(ch => ch.stages.includes(stage.id));
      const pageSize = 2; // 2 large, ultra-readable study cards per page!
      const totalPages = Math.max(1, Math.ceil(stageLabs.length / pageSize));
      if (state.stagePage >= totalPages) state.stagePage = 0;
      const visibleLabs = stageLabs.slice(state.stagePage * pageSize, (state.stagePage + 1) * pageSize);

      return `
        <div class="h-full min-h-0 flex flex-col gap-3.5 overflow-hidden">
          <!-- 8-STAGE INTERACTIVE PIPELINE STRIP -->
          <section class="shrink-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3">
            <div class="grid grid-cols-8 gap-2">
              ${DEVOPS_STAGES.map(s => {
                const labsInStage = ALL_LABS.filter(l => l.stages.includes(s.id));
                const doneInStage = labsInStage.filter(l => isLabDone(l.labId)).length;
                const allStageDone = labsInStage.length > 0 && doneInStage === labsInStage.length;
                const active = s.id === stage.id;
                return `
                  <button data-select-stage="${s.id}" class="stage-pill text-left px-2.5 py-2 rounded-lg border transition-all cursor-pointer ${
                    active
                      ? 'border-[var(--primary)] bg-[var(--secondary)]'
                      : 'border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)]'
                  }">
                    <div class="flex items-center justify-between gap-1 mb-0.5">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(${s.colorVar})"></span>
                      <span class="t-micro font-mono ${allStageDone ? 'text-[var(--success)] font-bold' : 'text-[var(--muted-foreground)]'}">${doneInStage}/${labsInStage.length}${allStageDone ? ' ✓' : ''}</span>
                    </div>
                    <div class="t-ui font-bold text-[var(--foreground)] truncate">${s.order}. ${s.en}</div>
                    <div class="t-micro text-[var(--muted-foreground)] truncate">${s.zh}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- SPACIOUS 2-COLUMN STUDY WORKSPACE (5 + 7 COLS) -->
          <section class="flex-1 min-h-0 grid grid-cols-12 gap-3.5 overflow-hidden">
            <!-- LEFT 5 COLS: STAGE OVERVIEW + TABBED DEPENDENCY/CHECKLIST GUIDE -->
            <div class="col-span-5 flex flex-col gap-3 min-h-0 overflow-hidden">
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shrink-0 select-text">
                <div class="flex items-center justify-between gap-2 mb-2">
                  <div class="flex items-center gap-2.5">
                    <span class="w-3 h-3 rounded-full" style="background-color: var(${stage.colorVar})"></span>
                    <h2 class="t-title font-bold text-[var(--foreground)]">${stage.en} · ${stage.zh}</h2>
                  </div>
                  <span class="t-micro font-mono px-2.5 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)]">Stage ${stage.order}/8</span>
                </div>
                <p class="t-body text-[var(--muted-foreground)]">${stage.summary}</p>
              </div>

              <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex flex-col overflow-hidden">
                <div class="flex items-center justify-between gap-2 pb-2.5 mb-3 border-b border-[var(--border)] shrink-0">
                  <div class="flex items-center gap-1.5 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)]">
                    <button data-stage-info-tab="flow" class="px-3 py-1 rounded-md t-ui font-medium cursor-pointer transition-colors ${state.stageInfoTab === 'flow' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">階段相依流向</button>
                    <button data-stage-info-tab="checklist" class="px-3 py-1 rounded-md t-ui font-medium cursor-pointer transition-colors ${state.stageInfoTab === 'checklist' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">實務檢查清單</button>
                  </div>
                  <span class="t-micro text-[var(--muted-foreground)]">涵蓋 ${stageChapters.length} 章</span>
                </div>

                <div class="flex-1 min-h-0 flex flex-col justify-between overflow-hidden select-text">
                  ${state.stageInfoTab === 'flow' ? `
                    <div class="space-y-3">
                      <div class="p-3.5 rounded-lg bg-[var(--background)] border border-[var(--border)]">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                          <span class="t-ui font-semibold text-[var(--foreground)]">上游輸入 (Upstream)</span>
                          <div class="flex items-center gap-1.5">${stage.upstream.map(id => stageBadgeHtml(id, true)).join('')}</div>
                        </div>
                        <p class="t-body text-[var(--muted-foreground)]">${stage.upstreamNote}</p>
                      </div>
                      <div class="p-3.5 rounded-lg bg-[var(--background)] border border-[var(--border)]">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                          <span class="t-ui font-semibold text-[var(--foreground)]">下游解鎖 (Downstream)</span>
                          <div class="flex items-center gap-1.5">${stage.downstream.map(id => stageBadgeHtml(id, true)).join('')}</div>
                        </div>
                        <p class="t-body text-[var(--muted-foreground)]">${stage.downstreamNote}</p>
                      </div>
                    </div>
                    <div class="pt-2.5 border-t border-[var(--border)] flex items-center gap-1.5 flex-wrap">
                      <span class="t-micro font-semibold text-[var(--muted-foreground)] mr-1">相關章節：</span>
                      ${stageChapters.map(ch => `
                        <button data-open-lab="${ch.id}|0" class="px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-micro text-[var(--foreground)] cursor-pointer transition-colors">
                          <strong class="font-mono text-[var(--primary)]">${ch.num}</strong> ${ch.short}
                        </button>
                      `).join('')}
                    </div>
                  ` : `
                    <ul class="space-y-3 t-body text-[var(--foreground)]">
                      ${stage.checklist.map(item => `
                        <li class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-start gap-2.5">
                          <span class="text-[var(--success)] font-bold shrink-0">✓</span>
                          <span>${item}</span>
                        </li>
                      `).join('')}
                    </ul>
                    <div class="pt-2.5 border-t border-[var(--border)] flex items-center justify-between gap-2 flex-wrap">
                      <span class="t-micro font-semibold text-[var(--muted-foreground)]">關鍵指標</span>
                      <div class="flex flex-wrap gap-1.5">
                        ${stage.metrics.map(m => `<span class="t-micro px-2.5 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">${m}</span>`).join('')}
                      </div>
                    </div>
                  `}
                </div>
              </div>
            </div>

            <!-- RIGHT 7 COLS: 2 LARGE, COMFORTABLE LAB STUDY CARDS PER PAGE -->
            <div class="col-span-7 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex flex-col min-h-0 overflow-hidden">
              <div class="flex items-center justify-between gap-2 mb-3 shrink-0">
                <div>
                  <h3 class="t-lead font-bold text-[var(--foreground)]">本階段實戰 Lab 與知識點（共 ${stageLabs.length} 項）</h3>
                  <p class="t-micro text-[var(--muted-foreground)]">點擊卡片進入完整章節學習，或直接點擊右上角按鈕勾選完成進度</p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button data-stage-page="-1" ${totalPages <= 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] disabled:opacity-40 t-ui font-medium cursor-pointer">← 上一頁</button>
                  <span class="t-ui font-mono font-semibold text-[var(--foreground)] px-1">${state.stagePage + 1} / ${totalPages}</span>
                  <button data-stage-page="1" ${totalPages <= 1 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] disabled:opacity-40 t-ui font-medium cursor-pointer">下一頁 →</button>
                </div>
              </div>

              <div class="flex-1 min-h-0 grid grid-rows-2 gap-3 overflow-hidden">
                ${visibleLabs.map(item => {
                  const done = isLabDone(item.labId);
                  return `
                    <div data-open-lab="${item.chapterId}|${item.labIndex}" role="button" tabindex="0" class="text-left p-4 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] transition-colors flex flex-col justify-between min-h-0 overflow-hidden cursor-pointer">
                      <div class="min-h-0">
                        <div class="flex items-center justify-between gap-2 mb-2">
                          <div class="flex items-center gap-2 min-w-0">
                            <span class="font-mono t-ui font-bold px-2 py-0.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] shrink-0">${item.chapterNum}</span>
                            <span class="t-lead font-bold text-[var(--foreground)] truncate">${item.label}</span>
                          </div>
                          <button data-toggle-lab="${item.labId}" title="${done ? '取消完成標記' : '標記為已完成'}" class="px-3 py-1 rounded-lg border t-ui font-semibold cursor-pointer transition-colors shrink-0 ${
                            done
                              ? 'tint-success border-[var(--success)] text-[var(--success)]'
                              : 'bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                          }">${done ? '✓ 已學完' : '☐ 標記完成'}</button>
                        </div>
                        <ul class="space-y-1.5 t-body text-[var(--foreground)]">
                          <li class="clamp-2">• ${escapeHtml(item.points[0])}</li>
                          ${item.points[1] ? `<li class="clamp-2 text-[var(--muted-foreground)]">• ${escapeHtml(item.points[1])}</li>` : ''}
                        </ul>
                      </div>
                      <div class="pt-2.5 mt-2 border-t border-[var(--border)] flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5 flex-wrap">${item.stages.map(sid => stageBadgeHtml(sid)).join('')}</div>
                        <span class="t-ui font-semibold text-[var(--primary)] shrink-0">開始學習本 Lab →</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 5. VIEW 2: CHAPTERS & KNOWLEDGE POINTS (COMFORTABLE 2x2 STUDY CARDS)
    // =========================================================================
    function renderChaptersView() {
      const ch = chapterMap[state.selectedChapterId];
      const chIdx = CHAPTERS.findIndex(c => c.id === ch.id);
      const lab = ch.labs[state.selectedLabIndex] || ch.labs[0];
      const labDone = isLabDone(lab.id);
      const chProg = getChapterProgress(ch);

      return `
        <div class="h-full min-h-0 flex gap-3.5 overflow-hidden">
          <!-- LEFT RAIL (255px): ALL 10 CHAPTERS WITH CLEAR READABLE LABELS -->
          <aside class="w-64 shrink-0 bg-[var(--sidebar)] border border-[var(--border)] rounded-xl p-2.5 flex flex-col min-h-0 overflow-hidden">
            <div class="px-2 pb-2 mb-1.5 border-b border-[var(--border)] flex items-center justify-between shrink-0">
              <span class="t-ui font-bold text-[var(--foreground)]">課程 10 大章節</span>
              <span class="t-micro font-mono text-[var(--muted-foreground)]">${chIdx + 1} / 10</span>
            </div>
            <div class="flex-1 min-h-0 grid grid-rows-[repeat(10,minmax(0,1fr))] gap-1 overflow-hidden">
              ${CHAPTERS.map(item => {
                const active = item.id === ch.id;
                const primaryStage = stageMap[item.stages[0]];
                const cp = getChapterProgress(item);
                return `
                  <button data-select-chapter="${item.id}" class="w-full px-2.5 rounded-lg border text-left flex items-center justify-between gap-2 transition-colors cursor-pointer min-h-0 ${
                    active
                      ? 'bg-[var(--card)] border-[var(--primary)] text-[var(--foreground)] font-bold'
                      : 'bg-transparent border-transparent hover:bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                  }">
                    <div class="flex items-center gap-2 min-w-0">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: var(${cp.allDone ? '--success' : primaryStage.colorVar})"></span>
                      <span class="font-mono t-ui shrink-0 ${active ? 'text-[var(--primary)]' : ''}">${item.num}</span>
                      <span class="t-ui truncate">${item.short}</span>
                    </div>
                    <span class="t-micro font-mono shrink-0 ${cp.allDone ? 'text-[var(--success)] font-bold' : 'text-[var(--muted-foreground)]'}">${cp.done}/${cp.total}${cp.allDone ? '✓' : ''}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </aside>

          <!-- MAIN STUDY CANVAS -->
          <section class="flex-1 min-w-0 flex flex-col gap-3 min-h-0 overflow-hidden">
            <!-- CHAPTER HEADER & HORIZONTAL LAB PILLS -->
            <div class="shrink-0 bg-[var(--card)] border border-[var(--border)] rounded-xl px-4 py-3">
              <div class="flex items-center justify-between gap-3 mb-2">
                <div class="flex items-center gap-2.5 min-w-0">
                  <span class="font-mono t-ui font-bold px-2.5 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] shrink-0">${ch.num}</span>
                  <h2 class="t-title font-bold text-[var(--foreground)] truncate">${ch.title}</h2>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <span class="t-micro font-mono font-semibold px-2.5 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--foreground)]">本章 ${chProg.done}/${chProg.total}</span>
                  <button data-toggle-lab="${lab.id}" title="快捷鍵 Space 切換完成狀態" class="px-3 py-1 rounded-lg border t-ui font-semibold cursor-pointer transition-colors ${
                    labDone
                      ? 'tint-success border-[var(--success)] text-[var(--success)]'
                      : 'bg-[var(--background)] border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)]'
                  }">${labDone ? '✓ 本主題已學完' : '☐ 標記已學完 (Space)'}</button>
                </div>
              </div>

              <!-- HORIZONTAL LAB SWITCHER -->
              <div class="flex items-center justify-between gap-2 pt-2 border-t border-[var(--border)]">
                <div class="flex items-center gap-1.5 flex-wrap">
                  ${ch.labs.map((l, idx) => {
                    const active = idx === state.selectedLabIndex;
                    const done = isLabDone(l.id);
                    return `
                      <button data-select-lab="${idx}" class="px-3 py-1 rounded-lg t-ui font-medium border transition-colors cursor-pointer flex items-center gap-1.5 ${
                        active
                          ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]'
                          : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)] hover:bg-[var(--secondary)]'
                      }">
                        ${done ? `<span class="${active ? '' : 'text-[var(--success)]'} font-bold">✓</span>` : ''}
                        <span>${l.label}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button data-step-lab="-1" class="px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-ui cursor-pointer" title="上一個 Lab (←)">←</button>
                  <button data-step-lab="1" class="px-2.5 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-ui cursor-pointer" title="下一個 Lab (→)">→</button>
                </div>
              </div>
            </div>

            <!-- BODY SPLIT: MAIN READING AREA (8 COLS) + STUDY COMPANION (4 COLS) -->
            <div class="flex-1 min-h-0 grid grid-cols-12 gap-3.5 overflow-hidden">
              <!-- LEFT 8 COLS: DEDICATED READING CARD WITH 4 STUDY SUB-TABS -->
              <div class="col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex flex-col min-h-0 overflow-hidden">
                <div class="flex items-center justify-between gap-2 pb-3 mb-3 border-b border-[var(--border)] shrink-0">
                  <div class="flex items-center gap-1.5 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)]">
                    <button data-detail-tab="points" class="px-3 py-1 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.labDetailTab === 'points' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">核心知識點</button>
                    <button data-detail-tab="steps" class="px-3 py-1 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.labDetailTab === 'steps' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">實作關鍵步驟</button>
                    <button data-detail-tab="code" class="px-3 py-1 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.labDetailTab === 'code' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">指令 / 設定</button>
                    <button data-detail-tab="insight" class="px-3 py-1 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.labDetailTab === 'insight' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">實戰洞察與陷阱</button>
                  </div>
                  <div class="hidden xl:flex items-center gap-1.5 shrink-0">${lab.stages.map(s => stageBadgeHtml(s, true)).join('')}</div>
                </div>

                <!-- SPACIOUS 2x2 READING CARDS (FITS HUGE TEXT WITH ZERO SCROLL!) -->
                <div class="flex-1 min-h-0 flex flex-col overflow-hidden select-text">
                  ${state.labDetailTab === 'points' ? `
                    <div class="flex-1 min-h-0 grid grid-cols-2 grid-rows-2 gap-3 overflow-hidden">
                      ${lab.points.map((pt, i) => `
                        <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)] flex flex-col justify-between overflow-hidden">
                          <div class="flex items-center gap-2 mb-2 shrink-0">
                            <span class="w-6 h-6 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] font-mono t-micro font-bold flex items-center justify-center shrink-0">0${i + 1}</span>
                            <span class="t-micro font-semibold text-[var(--muted-foreground)]">知識要點 ${i + 1}</span>
                          </div>
                          <p class="t-body text-[var(--foreground)] flex-1">${escapeHtml(pt)}</p>
                        </div>
                      `).join('')}
                    </div>
                  ` : state.labDetailTab === 'steps' ? `
                    <div class="flex-1 min-h-0 grid grid-cols-2 grid-rows-2 gap-3 overflow-hidden">
                      ${lab.steps.map((st, i) => `
                        <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)] flex flex-col justify-start overflow-hidden">
                          <div class="flex items-center gap-2 mb-2 shrink-0">
                            <span class="px-2 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--foreground)] font-mono t-micro font-bold">STEP ${i + 1}</span>
                          </div>
                          <p class="t-body text-[var(--foreground)]">${escapeHtml(st.replace(/^\d+\.\s*/, ''))}</p>
                        </div>
                      `).join('')}
                    </div>
                  ` : state.labDetailTab === 'code' ? `
                    <div class="flex-1 min-h-0 flex flex-col bg-[var(--background)] border border-[var(--border)] rounded-xl overflow-hidden">
                      <div class="px-4 py-2.5 border-b border-[var(--border)] bg-[var(--sidebar)] flex items-center justify-between shrink-0">
                        <span class="t-ui font-semibold text-[var(--foreground)]">${escapeHtml(lab.codeTitle)}</span>
                        <button id="btn-copy-lab-code" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui font-medium text-[var(--foreground)] cursor-pointer">複製程式碼</button>
                      </div>
                      <pre class="p-4 code-block text-[var(--code-foreground)] m-0 flex-1 overflow-hidden">${escapeHtml(lab.code)}</pre>
                    </div>
                  ` : `
                    <div class="flex-1 min-h-0 flex flex-col justify-between gap-3 overflow-hidden">
                      <div class="p-5 rounded-xl tint-warning border border-[var(--warning)]">
                        <div class="t-ui font-bold text-[var(--foreground)] mb-2">實戰關鍵洞察與常見陷阱（${ch.num}）</div>
                        <p class="t-lead text-[var(--foreground)]">${escapeHtml(ch.insight)}</p>
                      </div>
                      <div class="p-4 rounded-xl bg-[var(--background)] border border-[var(--border)]">
                        <div class="t-ui font-bold text-[var(--foreground)] mb-1.5">本章學習目標摘要</div>
                        <p class="t-body text-[var(--muted-foreground)]">${escapeHtml(ch.summary)}</p>
                      </div>
                      <div class="p-3.5 rounded-xl bg-[var(--background)] border border-[var(--border)] flex items-center gap-2 flex-wrap">
                        <span class="t-ui font-semibold text-[var(--muted-foreground)] mr-1">技術堆疊：</span>
                        ${ch.tech.map(t => `<span class="t-micro px-2.5 py-1 rounded-md bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">${t}</span>`).join('')}
                      </div>
                    </div>
                  `}
                </div>
              </div>

              <!-- RIGHT 4 COLS: FULL-NAME 4x2 STAGE LOCATOR + TABBED DEPENDENCIES -->
              <div class="col-span-4 flex flex-col gap-3 min-h-0 overflow-hidden">
                <!-- FULL-NAME 4x2 DEVOPS STAGE LOCATOR -->
                <div class="shrink-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3.5">
                  <div class="flex items-center justify-between mb-2">
                    <span class="t-ui font-bold text-[var(--foreground)]">DevOps 階段定位</span>
                    <span class="t-micro text-[var(--muted-foreground)]">點擊跳轉階段</span>
                  </div>
                  <div class="grid grid-cols-4 gap-1.5 mb-2">
                    ${DEVOPS_STAGES.map(s => {
                      const inLab = lab.stages.includes(s.id);
                      const inCh = ch.stages.includes(s.id);
                      return `
                        <button data-jump-stage="${s.id}" title="${s.en} (${s.zh})" class="py-1.5 px-1.5 rounded-lg text-center border t-micro font-medium cursor-pointer transition-colors truncate ${
                          inLab
                            ? 'border-[var(--primary)] text-[var(--foreground)] font-bold'
                            : inCh
                              ? 'border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)]'
                              : 'border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)] opacity-55'
                        }" ${inLab ? `style="background-color: color-mix(in srgb, var(${s.colorVar}) 24%, transparent)"` : ''}>
                          ${s.en}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  <p class="t-micro text-[var(--muted-foreground)] leading-snug">${escapeHtml(ch.stageRole)}</p>
                </div>

                <!-- TABBED UPSTREAM / DOWNSTREAM DEPENDENCIES (ZERO TRUNCATION!) -->
                <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3.5 flex flex-col overflow-hidden">
                  <div class="grid grid-cols-2 gap-1.5 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)] mb-3 shrink-0">
                    <button data-ch-dep-tab="upstream" class="py-1.5 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.chapterDepTab === 'upstream' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">上游前置 (${ch.upstream.length})</button>
                    <button data-ch-dep-tab="downstream" class="py-1.5 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.chapterDepTab === 'downstream' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">下游解鎖 (${ch.downstream.length})</button>
                  </div>

                  <div class="flex-1 min-h-0 flex flex-col gap-2 overflow-hidden">
                    ${state.chapterDepTab === 'upstream' ? (
                      ch.upstream.length === 0
                        ? `<div class="p-4 rounded-lg bg-[var(--background)] border border-[var(--border)] t-body text-[var(--muted-foreground)]">無前置章節相依，本章為整體課程與 DevOps 平台起點。</div>`
                        : ch.upstream.slice(0, 4).map(dep => {
                            const target = chapterMap[dep.id];
                            return `
                              <button data-open-lab="${dep.id}|0" class="w-full text-left p-2.5 rounded-lg bg-[var(--background)] hover:bg-[var(--secondary)] border border-[var(--border)] cursor-pointer transition-colors">
                                <div class="flex items-center justify-between gap-2 mb-0.5">
                                  <span class="t-ui font-bold text-[var(--foreground)]"><span class="font-mono text-[var(--primary)]">${target.num}</span> ${target.short}</span>
                                  <span class="t-micro text-[var(--muted-foreground)]">前往 ↗</span>
                                </div>
                                <p class="t-micro text-[var(--muted-foreground)] clamp-2">${dep.reason}</p>
                              </button>
                            `;
                          }).join('')
                    ) : (
                      ch.downstream.slice(0, 4).map(dep => {
                        const target = chapterMap[dep.id];
                        return `
                          <button data-open-lab="${dep.id}|0" class="w-full text-left p-2.5 rounded-lg bg-[var(--background)] hover:bg-[var(--secondary)] border border-[var(--border)] cursor-pointer transition-colors">
                            <div class="flex items-center justify-between gap-2 mb-0.5">
                              <span class="t-ui font-bold text-[var(--foreground)]"><span class="font-mono text-[var(--success)]">${target.num}</span> ${target.short}</span>
                              <span class="t-micro text-[var(--muted-foreground)]">前往 →</span>
                            </div>
                            <p class="t-micro text-[var(--muted-foreground)] clamp-2">${dep.reason}</p>
                          </button>
                        `;
                      }).join('')
                    )}
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 6. VIEW 3: INTERACTIVE SVG DEPENDENCY DAG (LARGE READABLE NODES)
    // =========================================================================
    function renderDagView() {
      const selId = state.dagSelectedId;
      const selCh = chapterMap[selId];
      const selProg = getChapterProgress(selCh);
      const upIds = new Set(selCh.upstream.map(u => u.id));
      const downIds = new Set(selCh.downstream.map(d => d.id));
      const nodeById = Object.fromEntries(DAG_NODES.map(n => [n.id, n]));

      const filterDefs = [
        { id: 'all', label: '全部相依拓撲' },
        { id: 'ci', label: 'CI 品質安全鏈' },
        { id: 'cd', label: 'CD 發布交付鏈' },
        { id: 'agile', label: '敏捷與回饋閉環' },
        { id: 'sec', label: '資安機密與 IaC' }
      ];

      const edgesSvg = DAG_EDGES.map(edge => {
        const a = nodeById[edge.from];
        const b = nodeById[edge.to];
        const matchesFilter = state.dagFilter === 'all' || edge.group === state.dagFilter;
        const isUpEdge = edge.to === selId;
        const isDownEdge = edge.from === selId;
        const highlighted = isUpEdge || isDownEdge;

        let pathD = '';
        if (edge.feedback) {
          pathD = `M ${a.x} ${a.y - 30} C ${a.x - 100} 20, ${b.x + 120} 20, ${b.x} ${b.y - 30}`;
        } else {
          const mx = (a.x + b.x) / 2;
          pathD = `M ${a.x + 58} ${a.y} C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x - 58} ${b.y}`;
        }

        const stroke = isUpEdge ? 'var(--chart-1)' : isDownEdge ? 'var(--success)' : edge.feedback ? 'var(--warning)' : 'var(--border)';
        const opacity = !matchesFilter ? 0.08 : highlighted ? 1 : 0.45;
        const width = highlighted ? 2.8 : 1.5;
        const marker = isUpEdge ? 'url(#arrow-up)' : isDownEdge ? 'url(#arrow-down)' : edge.feedback ? 'url(#arrow-fb)' : 'url(#arrow-muted)';

        return `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${width}" opacity="${opacity}" ${edge.feedback ? 'stroke-dasharray="6 4"' : ''} marker-end="${marker}" class="dag-edge" />`;
      }).join('');

      const nodesSvg = DAG_NODES.map(n => {
        const ch = chapterMap[n.id];
        const cp = getChapterProgress(ch);
        const isSel = n.id === selId;
        const isUp = upIds.has(n.id);
        const isDown = downIds.has(n.id);
        const related = isSel || isUp || isDown;
        const stroke = isSel ? 'var(--primary)' : isUp ? 'var(--chart-1)' : isDown ? 'var(--success)' : 'var(--border)';
        const strokeW = isSel ? 2.8 : related ? 2 : 1.3;
        const opacity = related ? 1 : 0.55;

        return `
          <g data-dag-node="${n.id}" class="dag-node" opacity="${opacity}">
            <rect x="${n.x - 58}" y="${n.y - 30}" width="116" height="60" rx="10"
              fill="var(--background)" stroke="${stroke}" stroke-width="${strokeW}" />
            <circle cx="${n.x - 42}" cy="${n.y - 9}" r="4.5" fill="var(${cp.allDone ? '--success' : n.stageColor})" />
            <text x="${n.x - 32}" y="${n.y - 4}" fill="var(--foreground)" font-size="14" font-weight="700" font-family="ui-monospace, monospace">${n.label}</text>
            <text x="${n.x + 48}" y="${n.y - 4}" text-anchor="end" fill="${cp.allDone ? 'var(--success)' : 'var(--muted-foreground)'}" font-size="13" font-family="ui-monospace, monospace">${cp.allDone ? '✓' : `${cp.done}/${cp.total}`}</text>
            <text x="${n.x}" y="${n.y + 17}" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5" font-weight="500">${n.sub}</text>
          </g>
        `;
      }).join('');

      return `
        <div class="h-full min-h-0 grid grid-cols-12 gap-3.5 overflow-hidden">
          <!-- LEFT 8 COLS: INTERACTIVE SVG DAG -->
          <div class="col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3.5 flex flex-col min-h-0 overflow-hidden">
            <div class="flex items-center justify-between gap-2 pb-2.5 mb-2 border-b border-[var(--border)] shrink-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                ${filterDefs.map(f => `
                  <button data-dag-filter="${f.id}" class="px-3 py-1 rounded-lg t-ui font-medium border cursor-pointer transition-colors ${
                    state.dagFilter === f.id
                      ? 'bg-[var(--primary)] text-[var(--primary-foreground)] border-[var(--primary)]'
                      : 'bg-[var(--background)] text-[var(--foreground)] border-[var(--border)] hover:bg-[var(--secondary)]'
                  }">${f.label}</button>
                `).join('')}
              </div>
              <div class="hidden xl:flex items-center gap-3 t-micro text-[var(--muted-foreground)] shrink-0">
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 inline-block" style="background:var(--chart-1)"></span>上游前置</span>
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 inline-block" style="background:var(--success)"></span>下游解鎖</span>
                <span class="flex items-center gap-1"><span class="w-3 h-0.5 inline-block border-t border-dashed" style="border-color:var(--warning)"></span>監控回饋</span>
              </div>
            </div>

            <div class="flex-1 min-h-0 flex items-center justify-center overflow-hidden">
              <svg viewBox="0 0 890 465" class="w-full h-full" role="img" aria-label="AZ-400 DevOps 章節相依性拓撲圖">
                <defs>
                  <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--border)" />
                  </marker>
                  <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--chart-1)" />
                  </marker>
                  <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--success)" />
                  </marker>
                  <marker id="arrow-fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--warning)" />
                  </marker>
                </defs>

                <text x="75" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">前置基礎</text>
                <text x="215" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">Plan / Code</text>
                <text x="375" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">CI/CD 入門</text>
                <text x="540" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">Build / Test / Pkg / IaC</text>
                <text x="695" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">DevSecOps</text>
                <text x="805" y="452" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">Release / Deploy</text>
                <text x="515" y="22" text-anchor="middle" fill="var(--muted-foreground)" font-size="13.5">Monitor 線上指標與缺陷回饋閉環 (CD → Plan)</text>

                ${edgesSvg}
                ${nodesSvg}
              </svg>
            </div>
          </div>

          <!-- RIGHT 4 COLS: SPACIOUS TABBED NODE INSPECTOR -->
          <div class="col-span-4 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex flex-col justify-between min-h-0 overflow-hidden">
            <div class="flex flex-col flex-1 min-h-0 overflow-hidden">
              <div class="pb-3 mb-3 border-b border-[var(--border)] shrink-0">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <span class="font-mono t-ui font-bold px-2.5 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)]">${selCh.num}</span>
                  <div class="flex items-center gap-1.5 flex-wrap justify-end">${selCh.stages.map(s => stageBadgeHtml(s, true)).join('')}</div>
                </div>
                <h2 class="t-lead font-bold text-[var(--foreground)] mb-1">${selCh.title}</h2>
                <p class="t-micro text-[var(--muted-foreground)]">${selCh.stageRole}</p>
              </div>

              <div class="grid grid-cols-2 gap-1.5 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)] mb-3 shrink-0">
                <button data-dag-dep-tab="upstream" class="py-1.5 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.dagDepTab === 'upstream' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">上游前置 (${selCh.upstream.length})</button>
                <button data-dag-dep-tab="downstream" class="py-1.5 rounded-md t-ui font-semibold cursor-pointer transition-colors ${state.dagDepTab === 'downstream' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">下游解鎖 (${selCh.downstream.length})</button>
              </div>

              <div class="flex-1 min-h-0 space-y-2 overflow-hidden">
                ${state.dagDepTab === 'upstream' ? (
                  selCh.upstream.length === 0
                    ? `<div class="p-3.5 rounded-lg bg-[var(--background)] border border-[var(--border)] t-body text-[var(--muted-foreground)]">無上游相依，為整體知識體系起點。</div>`
                    : selCh.upstream.slice(0, 4).map(u => `
                        <button data-dag-node="${u.id}" class="w-full text-left p-2.5 rounded-lg bg-[var(--background)] hover:bg-[var(--secondary)] border border-[var(--border)] cursor-pointer transition-colors">
                          <div class="t-ui font-bold text-[var(--foreground)]"><span class="font-mono" style="color: var(--chart-1)">${chapterMap[u.id].num}</span> ${chapterMap[u.id].short}</div>
                          <div class="t-micro text-[var(--muted-foreground)] mt-0.5 clamp-2">${u.reason}</div>
                        </button>
                      `).join('')
                ) : (
                  selCh.downstream.slice(0, 4).map(d => `
                    <button data-dag-node="${d.id}" class="w-full text-left p-2.5 rounded-lg bg-[var(--background)] hover:bg-[var(--secondary)] border border-[var(--border)] cursor-pointer transition-colors">
                      <div class="t-ui font-bold text-[var(--foreground)]"><span class="font-mono" style="color: var(--success)">${chapterMap[d.id].num}</span> ${chapterMap[d.id].short}</div>
                      <div class="t-micro text-[var(--muted-foreground)] mt-0.5 clamp-2">${d.reason}</div>
                    </button>
                  `).join('')
                )}
              </div>
            </div>

            <div class="space-y-2 shrink-0 pt-3 border-t border-[var(--border)]">
              <button data-toggle-chapter="${selCh.id}" class="w-full py-2 px-3 rounded-lg border t-ui font-semibold cursor-pointer transition-colors ${
                selProg.allDone
                  ? 'tint-success border-[var(--success)] text-[var(--success)]'
                  : 'bg-[var(--background)] border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)]'
              }">

        { id: 'all', label: '全部範圍' },

      ];

      const domainBars = QUIZ_DOMAINS.map(d => {
        const qs = QUIZ_QUESTIONS.filter(q => q.domain === d.id);
        const right = qs.filter(q => progress.quizAnswers[q.id] === q.answer).length;
        const pct = qs.length ? Math.round((right / qs.length) * 100) : 0;
        return { ...d, right, total: qs.length, pct };
      });

      let leftPanelHtml = '';
      let navGridHtml = '';

      if (state.quizMode === 'mcq') {
        const list = getFilteredQuestions();
        if (state.quizIdx >= list.length) state.quizIdx = 0;

        if (list.length === 0) {

          `;
        } else {
          const q = list[state.quizIdx];
          const picked = progress.quizAnswers[q.id];
          const answered = picked !== undefined;
          const isCorrect = answered && picked === q.answer;
          const letters = ['A', 'B', 'C', 'D'];
          const ch = chapterMap[q.chapterId];
          const lab = ch.labs[q.labIndex] || ch.labs[0];

          leftPanelHtml = `
            <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 flex flex-col justify-between overflow-hidden">

                  <span class="font-mono t-ui font-bold px-2.5 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)]">Q ${String(state.quizIdx + 1).padStart(2, '0')} / ${String(list.length).padStart(2, '0')}</span>

                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button data-step-quiz="-1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-ui font-medium cursor-pointer">← 上一題</button>
