                }
                if (isCurr) cls += ' ring-2 ring-[var(--primary)] text-[var(--foreground)] font-bold';
                return `<button data-jump-quiz="${idx}" class="py-2 rounded-lg border t-ui font-mono cursor-pointer transition-colors ${cls}">${idx + 1}</button>`;
              }).join('')}
            </div>
          `;
        }
      } else {
        // FLASHCARD MODE
        const list = getFilteredFlashcards();
        if (state.fcIdx >= list.length) state.fcIdx = 0;

        if (list.length === 0) {
          leftPanelHtml = `
            <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-8 flex flex-col items-center justify-center text-center gap-4">
              <div class="t-title font-bold text-[var(--foreground)]">全部記憶卡都已標記為「已掌握」！</div>
              <p class="t-body text-[var(--muted-foreground)]">您可以切回「全部範圍」再次複習，或前往「模擬單選測驗」實戰檢驗。</p>
              <button data-quiz-filter="all" class="px-4 py-2 rounded-lg bg-[var(--primary)] text-[var(--primary-foreground)] t-ui font-bold cursor-pointer">檢視全部 16 張記憶卡</button>
            </div>
          `;
        } else {
          const fc = list[state.fcIdx];
          const status = progress.flashcardStatus[fc.id];
          const ch = chapterMap[fc.chapterId];
          const lab = ch.labs[fc.labIndex] || ch.labs[0];

          leftPanelHtml = `
            <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 flex flex-col justify-between overflow-hidden">
              <!-- CARD HEADER -->
              <div class="flex items-center justify-between gap-2 pb-3 border-b border-[var(--border)] shrink-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-mono t-ui font-bold px-2.5 py-0.5 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)]">Card ${String(state.fcIdx + 1).padStart(2, '0')} / ${String(list.length).padStart(2, '0')}</span>
                  ${stageBadgeHtml(fc.stageId, true)}
                  <span class="t-ui text-[var(--muted-foreground)]">${ch.num} · ${lab.label}</span>
                  ${status === 'mastered'
                    ? '<span class="t-micro px-2.5 py-0.5 rounded-md tint-success border border-[var(--success)] text-[var(--success)] font-bold">✓ 已掌握</span>'
                    : status === 'review'
                      ? '<span class="t-micro px-2.5 py-0.5 rounded-md tint-warning border border-[var(--warning)] text-[var(--foreground)] font-bold">待複習</span>'
                      : '<span class="t-micro px-2.5 py-0.5 rounded-md bg-[var(--secondary)] text-[var(--muted-foreground)]">未標記</span>'
                  }
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button data-step-fc="-1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-ui font-medium cursor-pointer">← 上一張</button>
                  <button data-step-fc="1" class="px-3 py-1 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] t-ui font-medium cursor-pointer">下一張 →</button>
                </div>
              </div>

              <!-- INTERACTIVE FLIPPABLE CARD SURFACE -->
              <div id="flashcard-surface" role="button" tabindex="0" class="flex-1 min-h-0 my-4 rounded-2xl border-2 p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-colors select-text ${
                state.fcFlipped
                  ? 'bg-[var(--sidebar)] border-[var(--primary)]'
                  : 'bg-[var(--background)] border-[var(--border)] hover:border-[var(--primary)]'
              }">
                <span class="t-ui font-semibold px-3.5 py-1 rounded-full mb-5 ${
                  state.fcFlipped
                    ? 'bg-[var(--primary)] text-[var(--primary-foreground)]'
                    : 'bg-[var(--secondary)] text-[var(--secondary-foreground)]'
                }">${state.fcFlipped ? '標準解答與實戰重點（背面）' : 'AZ-400 主動回憶題（正面）'}</span>

                ${state.fcFlipped ? `
                  <p class="t-lead text-[var(--foreground)] max-w-2xl mb-5">${escapeHtml(fc.back)}</p>
                  <button data-open-lab="${fc.chapterId}|${fc.labIndex}" class="px-4 py-1.5 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:bg-[var(--secondary)] t-ui font-semibold text-[var(--foreground)] cursor-pointer">
                    深入查看 ${ch.num} ${lab.label} →
                  </button>
                ` : `
                  <h2 class="t-hero font-bold text-[var(--foreground)] max-w-2xl mb-5">${escapeHtml(fc.front)}</h2>
                  <p class="t-ui text-[var(--muted-foreground)]">點擊卡片中央或按 <span class="kbd-chip">Space</span> 翻面核對答案</p>
                `}
              </div>

              <!-- FLASHCARD ACTION BAR -->
              <div class="shrink-0 flex items-center justify-between gap-2.5 pt-2.5 border-t border-[var(--border)]">
                <button data-mark-fc="review" class="flex-1 py-2.5 px-3 rounded-lg border t-ui font-semibold cursor-pointer transition-colors ${
                  status === 'review'
                    ? 'tint-warning border-[var(--warning)] text-[var(--foreground)]'
                    : 'bg-[var(--background)] border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)]'
                }">↺ 標記待複習 (R)</button>
                <button id="btn-flip-fc" class="px-5 py-2.5 rounded-lg border border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)] t-ui font-bold cursor-pointer">
                  ${state.fcFlipped ? '翻回題目 (Space)' : '翻看答案 (Space)'}
                </button>
                <button data-mark-fc="mastered" class="flex-1 py-2.5 px-3 rounded-lg border t-ui font-semibold cursor-pointer transition-colors ${
                  status === 'mastered'
                    ? 'tint-success border-[var(--success)] text-[var(--success)]'
                    : 'bg-[var(--background)] border-[var(--border)] text-[var(--foreground)] hover:bg-[var(--secondary)]'
                }">✓ 已完全掌握 (M)</button>
              </div>
            </div>
          `;

          navGridHtml = `
            <div class="grid grid-cols-4 gap-2">
              ${list.map((item, idx) => {
                const st = progress.flashcardStatus[item.id];
                const isCurr = idx === state.fcIdx;
                let cls = 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)]';
                if (st === 'mastered') cls = 'tint-success border-[var(--success)] text-[var(--success)] font-bold';
                else if (st === 'review') cls = 'tint-warning border-[var(--warning)] text-[var(--foreground)] font-bold';
                if (isCurr) cls += ' ring-2 ring-[var(--primary)] text-[var(--foreground)] font-bold';
                return `<button data-jump-fc="${idx}" class="py-2 rounded-lg border t-ui font-mono cursor-pointer transition-colors ${cls}">C${idx + 1}</button>`;
              }).join('')}
            </div>
          `;
        }
      }

      return `
        <div class="h-full min-h-0 flex flex-col gap-3 overflow-hidden">
          <!-- TOP CONTROL BAR -->
          <div class="shrink-0 bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5 flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2 flex-wrap">
              <div class="flex items-center gap-1 bg-[var(--background)] p-1 rounded-lg border border-[var(--border)]">
                <button data-quiz-mode="mcq" class="px-3 py-1 rounded-md t-ui font-bold cursor-pointer transition-colors ${
                  state.quizMode === 'mcq' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                }">模擬單選測驗 (${QUIZ_QUESTIONS.length})</button>
                <button data-quiz-mode="flashcard" class="px-3 py-1 rounded-md t-ui font-bold cursor-pointer transition-colors ${
                  state.quizMode === 'flashcard' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                }">翻轉記憶卡 (${FLASHCARDS.length})</button>
              </div>
              <div class="flex items-center gap-1.5 flex-wrap">
                ${filterPills.map(f => `
                  <button data-quiz-filter="${f.id}" class="px-2.5 py-1 rounded-lg border t-ui font-medium cursor-pointer transition-colors ${
                    state.quizFilter === f.id
                      ? 'bg-[var(--secondary)] border-[var(--primary)] text-[var(--foreground)] font-bold'
                      : 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
                  }">${f.label}</button>
                `).join('')}
              </div>
            </div>

            <button id="btn-reset-quiz" class="px-3 py-1 rounded-lg border t-ui font-medium cursor-pointer transition-colors shrink-0 ${
              state.confirmResetQuiz
                ? 'tint-error border-[var(--error)] text-[var(--error)]'
                : 'bg-[var(--background)] border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]'
            }">${state.confirmResetQuiz ? '再次點擊確認重置' : '重置測驗'}</button>
          </div>

          <!-- MAIN SPLIT: QUESTION/FLASHCARD STAGE (8 COLS) + SCOREBOARD & NAVIGATOR (4 COLS) -->
          <div class="flex-1 min-h-0 grid grid-cols-12 gap-3.5 overflow-hidden">
            <div class="col-span-8 flex flex-col min-h-0 overflow-hidden">
              ${leftPanelHtml}
            </div>

            <div class="col-span-4 flex flex-col gap-3 min-h-0 overflow-hidden">
              <!-- READINESS & DOMAIN MASTERY -->
              <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shrink-0">
                <div class="t-ui font-bold text-[var(--foreground)] mb-3">AZ-400 備試儀表板</div>
                <div class="grid grid-cols-3 gap-2 mb-3">
                  <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] text-center">
                    <div class="font-mono t-lead font-bold text-[var(--foreground)]">${stats.accuracy}%</div>
                    <div class="t-micro text-[var(--muted-foreground)]">答對率</div>
                  </div>
                  <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] text-center">
                    <div class="font-mono t-lead font-bold text-[var(--success)]">${stats.fcMastered}/${stats.totalFc}</div>
                    <div class="t-micro text-[var(--muted-foreground)]">記憶卡</div>
                  </div>
                  <div class="p-2.5 rounded-lg bg-[var(--background)] border border-[var(--border)] text-center">
                    <div class="font-mono t-lead font-bold text-[var(--primary)]">${overall.done}/${overall.total}</div>
                    <div class="t-micro text-[var(--muted-foreground)]">實作進度</div>
                  </div>
                </div>
                <div class="space-y-2">
                  ${domainBars.map(d => `
                    <div>
                      <div class="flex items-center justify-between t-micro mb-1">
                        <span class="text-[var(--muted-foreground)]">${d.label}</span>
                        <span class="font-mono font-semibold text-[var(--foreground)]">${d.right}/${d.total}</span>
                      </div>
                      <div class="w-full h-2 rounded-full bg-[var(--secondary)] overflow-hidden">
                        <div class="h-full rounded-full transition-all" style="width: ${d.pct}%; background-color: var(${d.colorVar});"></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- COMPACT QUESTION / CARD NAVIGATOR -->
              <div class="flex-1 min-h-0 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex flex-col justify-between overflow-hidden">
                <div>
                  <div class="flex items-center justify-between mb-2.5">
                    <span class="t-ui font-bold text-[var(--foreground)]">${state.quizMode === 'mcq' ? '題號快速跳轉' : '記憶卡快速跳轉'}</span>
                    <span class="t-micro font-mono text-[var(--muted-foreground)]">${state.quizMode === 'mcq' ? `已作答 ${stats.answered}/${stats.totalQ}` : `待複習 ${stats.fcReview}`}</span>
                  </div>
                  ${navGridHtml || '<div class="t-ui text-[var(--muted-foreground)]">目前篩選無項目</div>'}
                </div>
                <div class="pt-2.5 border-t border-[var(--border)] flex items-center justify-between t-micro text-[var(--muted-foreground)]">
                  <span><span class="text-[var(--success)] font-bold">■</span> 答對/掌握</span>
                  <span><span class="text-[var(--error)] font-bold">■</span> 錯題</span>
                  <span><span class="text-[var(--warning)] font-bold">■</span> 待複習</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. SEARCH MODAL LOGIC
    // =========================================================================
    function openSearch() {
      state.searchOpen = true;
      const modal = document.getElementById('search-modal');
      modal.classList.remove('hidden');
      const input = document.getElementById('search-input');
      input.value = '';
      renderSearchResults('');
      setTimeout(() => input.focus(), 20);
    }

    function closeSearch() {
      state.searchOpen = false;
      document.getElementById('search-modal').classList.add('hidden');
    }

    function renderSearchResults(query) {
      const q = query.trim().toLowerCase();
      const matches = q
        ? ALL_LABS.filter(item => item.searchText.includes(q))
        : ALL_LABS.slice().reverse();
      const top6 = matches.slice(0, 6);
      const container = document.getElementById('search-results');
      document.getElementById('search-count').textContent =
        matches.length === 0 ? '找不到相符結果' : `共找到 ${matches.length} 筆，顯示前 ${top6.length} 筆（免捲動）`;

      container.innerHTML = top6.map(item => {
        const done = isLabDone(item.labId);
        return `
          <button data-open-lab="${item.chapterId}|${item.labIndex}" class="text-left p-3 rounded-lg border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] cursor-pointer transition-colors">
            <div class="flex items-center justify-between gap-1 mb-1">
              <span class="font-mono t-ui font-bold ${done ? 'text-[var(--success)]' : 'text-[var(--primary)]'}">${done ? '✓ ' : ''}${item.chapterNum} · ${item.label}</span>
              <div class="flex gap-1">${item.stages.slice(0, 1).map(s => stageBadgeHtml(s)).join('')}</div>
            </div>
            <p class="t-micro text-[var(--muted-foreground)] truncate">${escapeHtml(item.points[0])}</p>
          </button>
        `;
      }).join('');

      container.querySelectorAll('[data-open-lab]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [cid, lidx] = btn.getAttribute('data-open-lab').split('|');
          jumpToChapterLab(cid, Number(lidx));
        });
      });
    }

    // =========================================================================
    // 10. MASTER RENDER & EVENT BINDING
    // =========================================================================
    function updateHeaderProgress() {
      const { done, total, pct } = getOverallProgress();
      const textEl = document.getElementById('header-progress-text');
      const barEl = document.getElementById('header-progress-bar');
      if (textEl) textEl.textContent = `${done}/${total} (${pct}%)`;
      if (barEl) barEl.style.width = `${pct}%`;
    }

    function render() {
      updateHeaderProgress();

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const active = btn.getAttribute('data-view') === state.view;
        btn.className = `nav-btn px-3 py-1.5 rounded-md t-ui font-semibold transition-colors flex items-center gap-1.5 cursor-pointer ${
          active
            ? 'bg-[var(--primary)] text-[var(--primary-foreground)]'
            : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:bg-[var(--secondary)]'
        }`;
      });

      const ws = document.getElementById('workspace');
      if (state.view === 'stages') {
        ws.innerHTML = renderStagesView();
      } else if (state.view === 'chapters') {
        ws.innerHTML = renderChaptersView();
      } else if (state.view === 'dag') {
        ws.innerHTML = renderDagView();
      } else if (state.view === 'reference') {
        ws.innerHTML = renderReferenceView();
      } else {
        ws.innerHTML = renderQuizView();
      }

      const statusEl = document.getElementById('status-readout');
      const { done, total } = getOverallProgress();
      if (state.view === 'stages') {
        const st = stageMap[state.selectedStageId];
        statusEl.textContent = `階段地圖 · ${st.order}/8 ${st.en} · 進度 ${done}/${total}`;
      } else if (state.view === 'chapters') {
        const ch = chapterMap[state.selectedChapterId];
        const lab = ch.labs[state.selectedLabIndex];
        statusEl.textContent = `${ch.num} ${ch.short} · ${lab.label} · ${isLabDone(lab.id) ? '已完成' : '未完成'}`;
      } else if (state.view === 'dag') {
        const ch = chapterMap[state.dagSelectedId];
        statusEl.textContent = `相依拓撲 · ${ch.num} ${ch.short} · 總進度 ${done}/${total}`;
      } else if (state.view === 'reference') {
        statusEl.textContent = `速查與解剖 · 總進度 ${done}/${total}`;
      } else {
        const qs = getQuizStats();
        statusEl.textContent = `AZ-400 考題測驗 · 答對率 ${qs.accuracy}% · 閃卡 ${qs.fcMastered}/${qs.totalFc}`;
      }

      bindWorkspaceEvents();
    }

    function bindWorkspaceEvents() {
      const ws = document.getElementById('workspace');

      ws.querySelectorAll('[data-toggle-lab]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleLabDone(el.getAttribute('data-toggle-lab'));
        });
      });

      ws.querySelectorAll('[data-toggle-chapter]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleChapterAllDone(el.getAttribute('data-toggle-chapter'));
        });
      });

      const resetProgBtn = document.getElementById('btn-reset-progress');
      if (resetProgBtn) {
        resetProgBtn.addEventListener('click', () => {
          if (!state.confirmResetProgress) {
            state.confirmResetProgress = true;
            render();
          } else {
            progress.completedLabs = [];
            state.confirmResetProgress = false;
            saveProgress();
            render();
          }
        });
      }

      ws.querySelectorAll('[data-select-stage]').forEach(el => {
        el.addEventListener('click', () => {
          state.selectedStageId = el.getAttribute('data-select-stage');
          state.stagePage = 0;
          render();
        });
      });

      ws.querySelectorAll('[data-stage-info-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.stageInfoTab = el.getAttribute('data-stage-info-tab');
          render();
        });
      });

      ws.querySelectorAll('[data-jump-stage]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          jumpToStage(el.getAttribute('data-jump-stage'));
        });
      });

      ws.querySelectorAll('[data-stage-page]').forEach(el => {
        el.addEventListener('click', () => {
          const delta = Number(el.getAttribute('data-stage-page'));
          const stageLabs = ALL_LABS.filter(item => item.stages.includes(state.selectedStageId));
          const totalPages = Math.max(1, Math.ceil(stageLabs.length / 2));
          state.stagePage = (state.stagePage + delta + totalPages) % totalPages;
          render();
        });
      });

      ws.querySelectorAll('[data-open-lab]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const [cid, lidx] = el.getAttribute('data-open-lab').split('|');
          jumpToChapterLab(cid, Number(lidx));
        });
      });

      ws.querySelectorAll('[data-select-chapter]').forEach(el => {
        el.addEventListener('click', () => {
          const cid = el.getAttribute('data-select-chapter');
          state.selectedChapterId = cid;
          state.selectedLabIndex = 0;
          state.labDetailTab = 'points';
          state.chapterDepTab = chapterMap[cid].upstream.length > 0 ? 'upstream' : 'downstream';
          render();
        });
      });

      ws.querySelectorAll('[data-select-lab]').forEach(el => {
        el.addEventListener('click', () => {
          state.selectedLabIndex = Number(el.getAttribute('data-select-lab'));
          render();
        });
      });

      ws.querySelectorAll('[data-step-lab]').forEach(el => {
        el.addEventListener('click', () => {
          const ch = chapterMap[state.selectedChapterId];
          const delta = Number(el.getAttribute('data-step-lab'));
          state.selectedLabIndex = (state.selectedLabIndex + delta + ch.labs.length) % ch.labs.length;
          render();
        });
      });

      ws.querySelectorAll('[data-detail-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.labDetailTab = el.getAttribute('data-detail-tab');
          render();
        });
      });

      ws.querySelectorAll('[data-ch-dep-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.chapterDepTab = el.getAttribute('data-ch-dep-tab');
          render();
        });
      });

      const copyLabBtn = document.getElementById('btn-copy-lab-code');
      if (copyLabBtn) {
        copyLabBtn.addEventListener('click', () => {
          const ch = chapterMap[state.selectedChapterId];
          const lab = ch.labs[state.selectedLabIndex];
          copyText(lab.code, copyLabBtn);
        });
      }

      ws.querySelectorAll('[data-dag-node]').forEach(el => {
        el.addEventListener('click', () => {
          const nid = el.getAttribute('data-dag-node');
          state.dagSelectedId = nid;
          state.dagDepTab = chapterMap[nid].upstream.length > 0 ? 'upstream' : 'downstream';
          render();
        });
      });

      ws.querySelectorAll('[data-dag-dep-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.dagDepTab = el.getAttribute('data-dag-dep-tab');
          render();
        });
      });

      ws.querySelectorAll('[data-dag-filter]').forEach(el => {
        el.addEventListener('click', () => {
          state.dagFilter = el.getAttribute('data-dag-filter');
          render();
        });
      });

      ws.querySelectorAll('[data-ref-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.refTab = el.getAttribute('data-ref-tab');
          state.confirmResetProgress = false;
          render();
        });
      });

      ws.querySelectorAll('[data-cmp-idx]').forEach(el => {
        el.addEventListener('click', () => {
          state.compareIdx = Number(el.getAttribute('data-cmp-idx'));
          render();
        });
      });

      ws.querySelectorAll('[data-yaml-idx]').forEach(el => {
        el.addEventListener('click', () => {
          state.yamlIdx = Number(el.getAttribute('data-yaml-idx'));
          render();
        });
      });

      ws.querySelectorAll('[data-sec-idx]').forEach(el => {
        el.addEventListener('click', () => {
          state.secLayerIdx = Number(el.getAttribute('data-sec-idx'));
          render();
        });
      });

      const copyYamlBtn = document.getElementById('btn-copy-yaml');
      if (copyYamlBtn) {
        copyYamlBtn.addEventListener('click', () => {
          copyText(YAML_ANATOMY[state.yamlIdx].lines, copyYamlBtn);
        });
      }

      ws.querySelectorAll('[data-cli-idx]').forEach(el => {
        el.addEventListener('click', () => {
          state.cliIdx = Number(el.getAttribute('data-cli-idx'));
          render();
        });
      });

      ws.querySelectorAll('[data-copy-cli]').forEach(el => {
        el.addEventListener('click', () => {
          const idx = Number(el.getAttribute('data-copy-cli'));
          copyText(CLI_DECKS[state.cliIdx].items[idx].code, el);
        });
      });

      // VIEW 5 QUIZ & FLASHCARD EVENTS
      ws.querySelectorAll('[data-quiz-mode]').forEach(el => {
        el.addEventListener('click', () => {
          state.quizMode = el.getAttribute('data-quiz-mode');
          state.fcFlipped = false;
          state.confirmResetQuiz = false;
          render();
        });
      });

      ws.querySelectorAll('[data-quiz-filter]').forEach(el => {
        el.addEventListener('click', () => {
          state.quizFilter = el.getAttribute('data-quiz-filter');
          state.quizIdx = 0;
          state.fcIdx = 0;
          state.fcFlipped = false;
          render();
        });
      });

      ws.querySelectorAll('[data-answer-opt]').forEach(el => {
        el.addEventListener('click', () => {
          const list = getFilteredQuestions();
          const q = list[state.quizIdx];
          if (!q) return;
          progress.quizAnswers[q.id] = Number(el.getAttribute('data-answer-opt'));
          state.confirmResetQuiz = false;
          saveProgress();
          render();
        });
      });

      ws.querySelectorAll('[data-step-quiz]').forEach(el => {
        el.addEventListener('click', () => {
          const list = getFilteredQuestions();
          if (!list.length) return;
          const delta = Number(el.getAttribute('data-step-quiz'));
          state.quizIdx = (state.quizIdx + delta + list.length) % list.length;
          render();
        });
      });

      ws.querySelectorAll('[data-jump-quiz]').forEach(el => {
        el.addEventListener('click', () => {
          state.quizIdx = Number(el.getAttribute('data-jump-quiz'));
          render();
        });
      });

      const fcSurface = document.getElementById('flashcard-surface');
      if (fcSurface) {
        fcSurface.addEventListener('click', () => {
          state.fcFlipped = !state.fcFlipped;
          render();
        });
      }

      const flipBtn = document.getElementById('btn-flip-fc');
      if (flipBtn) {
        flipBtn.addEventListener('click', () => {
          state.fcFlipped = !state.fcFlipped;
          render();
        });
      }

      ws.querySelectorAll('[data-step-fc]').forEach(el => {
        el.addEventListener('click', () => {
          const list = getFilteredFlashcards();
          if (!list.length) return;
          const delta = Number(el.getAttribute('data-step-fc'));
          state.fcIdx = (state.fcIdx + delta + list.length) % list.length;
          state.fcFlipped = false;
          render();
        });
      });

      ws.querySelectorAll('[data-jump-fc]').forEach(el => {
        el.addEventListener('click', () => {
          state.fcIdx = Number(el.getAttribute('data-jump-fc'));
          state.fcFlipped = false;
          render();
        });
      });

      ws.querySelectorAll('[data-mark-fc]').forEach(el => {
        el.addEventListener('click', () => {
          const list = getFilteredFlashcards();
          const fc = list[state.fcIdx];
          if (!fc) return;
          const mark = el.getAttribute('data-mark-fc');
          progress.flashcardStatus[fc.id] = mark;
          state.confirmResetQuiz = false;
          saveProgress();
          const nextList = getFilteredFlashcards();
          state.fcIdx = nextList.length > 1 ? (state.fcIdx + 1) % nextList.length : 0;
          state.fcFlipped = false;
          render();
        });
      });

      const resetQuizBtn = document.getElementById('btn-reset-quiz');
      if (resetQuizBtn) {
        resetQuizBtn.addEventListener('click', () => {
          if (!state.confirmResetQuiz) {
            state.confirmResetQuiz = true;
            render();
          } else {
            progress.quizAnswers = {};
            progress.flashcardStatus = {};
            state.quizIdx = 0;
            state.fcIdx = 0;
            state.fcFlipped = false;
            state.confirmResetQuiz = false;
            saveProgress();
            render();
          }
        });
      }
    }

    // Global Header & Keyboard Listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.getAttribute('data-view');
        state.confirmResetProgress = false;
        state.confirmResetQuiz = false;
        render();
      });
    });

    document.getElementById('btn-font-size').addEventListener('click', () => {
      const next = FONT_ORDER[(FONT_ORDER.indexOf(state.fontSize) + 1) % FONT_ORDER.length];
      applyFontSize(next);
    });

    document.getElementById('btn-header-progress').addEventListener('click', () => {
      state.view = 'reference';
      state.refTab = 'index';
      render();
    });

    document.getElementById('btn-jump-cd').addEventListener('click', () => {
      jumpToChapterLab('ch09', 0);
    });

    document.getElementById('btn-open-search').addEventListener('click', openSearch);
    document.getElementById('btn-close-search').addEventListener('click', closeSearch);
    document.getElementById('search-modal').addEventListener('click', (e) => {
      if (e.target.id === 'search-modal') closeSearch();
    });
    document.getElementById('search-input').addEventListener('input', (e) => {
      renderSearchResults(e.target.value);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.searchOpen) {
        closeSearch();
        return;
      }
      if (state.searchOpen) return;
      if (e.key === '/' || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k')) {
        e.preventDefault();
        openSearch();
        return;
      }
      if (e.key === '1') { state.view = 'stages'; render(); }
      else if (e.key === '2') { state.view = 'chapters'; render(); }
      else if (e.key === '3') { state.view = 'dag'; render(); }
      else if (e.key === '4') { state.view = 'reference'; render(); }
      else if (e.key === '5') { state.view = 'quiz'; render(); }
      else if (e.key === ' ') {
        if (state.view === 'chapters') {
          e.preventDefault();
          const ch = chapterMap[state.selectedChapterId];
          const lab = ch.labs[state.selectedLabIndex];
          if (lab) toggleLabDone(lab.id);
        } else if (state.view === 'quiz' && state.quizMode === 'flashcard') {
          e.preventDefault();
          state.fcFlipped = !state.fcFlipped;
          render();
        }
      } else if (state.view === 'quiz' && state.quizMode === 'mcq' && ['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
        const list = getFilteredQuestions();
        const q = list[state.quizIdx];
        if (q) {
          progress.quizAnswers[q.id] = ['a', 'b', 'c', 'd'].indexOf(e.key.toLowerCase());
          saveProgress();
          render();
        }
      } else if (state.view === 'quiz' && state.quizMode === 'flashcard' && ['m', 'r'].includes(e.key.toLowerCase())) {
        const list = getFilteredFlashcards();
        const fc = list[state.fcIdx];
        if (fc) {
          progress.flashcardStatus[fc.id] = e.key.toLowerCase() === 'm' ? 'mastered' : 'review';
          saveProgress();
          const nextList = getFilteredFlashcards();
          state.fcIdx = nextList.length > 1 ? (state.fcIdx + 1) % nextList.length : 0;
          state.fcFlipped = false;
          render();
        }
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        const delta = e.key === 'ArrowRight' ? 1 : -1;
        if (state.view === 'stages') {
          const idx = DEVOPS_STAGES.findIndex(s => s.id === state.selectedStageId);
          state.selectedStageId = DEVOPS_STAGES[(idx + delta + DEVOPS_STAGES.length) % DEVOPS_STAGES.length].id;
          state.stagePage = 0;
          render();
        } else if (state.view === 'chapters') {
          const ch = chapterMap[state.selectedChapterId];
          state.selectedLabIndex = (state.selectedLabIndex + delta + ch.labs.length) % ch.labs.length;
          render();
        } else if (state.view === 'reference' && state.refTab === 'compare') {
          state.compareIdx = (state.compareIdx + delta + COMPARISONS.length) % COMPARISONS.length;
          render();
        } else if (state.view === 'reference' && state.refTab === 'yaml') {
          state.yamlIdx = (state.yamlIdx + delta + YAML_ANATOMY.length) % YAML_ANATOMY.length;
          render();
        } else if (state.view === 'reference' && state.refTab === 'sec') {
          state.secLayerIdx = (state.secLayerIdx + delta + DEVSECOPS_LAYERS.length) % DEVSECOPS_LAYERS.length;
          render();
        } else if (state.view === 'quiz') {
          if (state.quizMode === 'mcq') {
            const list = getFilteredQuestions();
            if (list.length) {
              state.quizIdx = (state.quizIdx + delta + list.length) % list.length;
              render();
            }
          } else {
            const list = getFilteredFlashcards();
            if (list.length) {
              state.fcIdx = (state.fcIdx + delta + list.length) % list.length;
              state.fcFlipped = false;
              render();
            }
          }
        }
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const delta = e.key === 'ArrowDown' ? 1 : -1;
        if (state.view === 'chapters') {
          const idx = CHAPTERS.findIndex(c => c.id === state.selectedChapterId);
          const nextCh = CHAPTERS[(idx + delta + CHAPTERS.length) % CHAPTERS.length];
          state.selectedChapterId = nextCh.id;
          state.selectedLabIndex = 0;
          state.labDetailTab = 'points';
          state.chapterDepTab = nextCh.upstream.length > 0 ? 'upstream' : 'downstream';
          render();
        } else if (state.view === 'dag') {
          const idx = CHAPTERS.findIndex(c => c.id === state.dagSelectedId);
          const nextCh = CHAPTERS[(idx + delta + CHAPTERS.length) % CHAPTERS.length];
          state.dagSelectedId = nextCh.id;
          state.dagDepTab = nextCh.upstream.length > 0 ? 'upstream' : 'downstream';
          render();
        }
      }
    });

    // Standalone Light/Dark Theme Management
    const THEME_KEY = "az400_devops_portal_theme_v1";
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const btn = document.getElementById("btn-toggle-theme");
      if (btn) btn.textContent = theme === "dark" ? "淺色" : "深色";
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    (function initTheme() {
      let saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
      if (saved === "dark" || saved === "light") {
        applyTheme(saved);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(prefersDark ? "dark" : "light");
      }
      const btn = document.getElementById("btn-toggle-theme");
      if (btn) {
        btn.addEventListener("click", () => {
          const curr = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
          applyTheme(curr === "dark" ? "light" : "dark");
        });
      }
    })();

    // Initial render
    render();
  </script>
</body>
</html>
